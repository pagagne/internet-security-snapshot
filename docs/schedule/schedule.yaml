- id: greynoise-90-day-test
  owner: claude
  title: Test whether GreyNoise's API gives 90 days of tag activity, as its website does
  date: 2026-11-19
  done: "18 Nov 2026 (run early at the author's request): yes, with days=90 (91 daily windows)"
  details: >
    GreyNoise (18 Nov 2026): tags go back 90 days; the website's tag page has a 90-day selector.
    The API tag-activity call returned only 24 hours on 17-18 Nov. Run the greynoise_probe
    research task once (one run per source per day) trying the documented day-range options on
    two tags; never read the website automatically. If 90 days come back, the quarterly pull can
    read first-seen attack dates per tag directly and the weekly sweep becomes a back-up; tell
    the author either way. Result 18 Nov 2026 (run early, author): the parameter days=90 returns
    one 24-hour window for every day the tag was active over the last 90 days (91 for GreyNoise's
    example tag); other parameters return only the last day, and granularity=1d fails. The
    windows mark active days only (no daily counts; one total for the period). So the API gives
    the first day of attacks within the last 90 days for each tag. Next: the collector uses
    days=90 (greynoise-collector-90-days). Corrected 19 Nov 2026 after the first collector test: the
    windows are listed for every day of the 90 whether or not the tag was active (tags with a
    zero total have all 91), so the 90-day view gives one total per tag, not active days or a
    first-attack day; first-seen dates come from the weekly sweep.

