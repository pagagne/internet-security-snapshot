- id: censys
  owner: author
  title: Write and send the Censys research-access application
  date: 2026-11-17
  time: "10:00"
  minutes: 60
  details: >
    Moved from 15 Feb 2027. In your own words: Censys rejects requests written with AI tools,
    and the standing rules say you write it. Their form asks for: a 3-4 sentence project
    description with the research question and where results are published; your background
    (public profile or past work); how Censys helps and which access (BigQuery, delayed data
    is fine); how recent the data must be; confirmation of non-commercial use and citing
    Censys; agreement to the terms; your Censys username (make an account first). Log it in
    docs/PERMISSIONS.md.

- id: honeypot-capture
  owner: claude
  title: Daily honeypot capture (SANS ISC / DShield web honeypot), aggregates only
  date: 2026-11-02
  details: >
    A daily workflow that saves the ISC web-honeypot URL summary and categories as aggregates
    (first and last seen, counts per URL category; no IP addresses), at most one download a
    day, credited "SANS Technology Institute, Internet Storm Center". Map categories to CVEs
    for an exploratory first-attempt date beside T_exploit. Record the terms in
    docs/PERMISSIONS.md; register the measure in config/exploratory.yaml first.

