# Every action item of the Internet Security Snapshot, from now to the 2027 closing re-run.
# This file is the single source for:
#   docs/ANNUAL_PLAN.md          the action list, grouped by who does it
#   docs/schedule/snapshot.ics   the shared calendar feed (subscribe to its raw URL)
#   .github/workflows/schedule.yml  opens a GitHub issue for each author/Claude item when it is
#                                   due, and starts scheduled GitHub runs that have no cron
# After editing: python -m snapshot.schedule build   (the Checks workflow fails if you forget)
#
# Fields
#   id      unique slug; with the date it names the issue and the calendar entry
#   owner   author | reviewer | claude | github  (reviewer = the independent external reviewer)
#   title   short, starts with a verb where possible
#   date    YYYY-MM-DD (local date, America/New_York), or use `dates` (a list) or `repeat`
#   time    HH:MM local (America/New_York); omit for an all-day item
#   utc     true when `time` is UTC (GitHub cron times)
#   minutes duration (default 30)
#   days    number of days for an all-day span (default 1)
#   repeat  {months: [..], day: N, from: YYYY-MM, until: YYYY-MM}: one item per listed month
#   open    days before the date to open the GitHub issue (default 0; author items default 2)
#   dispatch {workflow: file.yml, inputs: {...}}: the daily schedule job runs this workflow
#   feeds   [reviewer]: also show this author/Claude item in the reviewer's own calendar feed
#   done    when finished (date or short note): the item stays in the calendar marked DONE and
#           opens no issue or run (author, 31 Oct 2026); older items say "- done ..." in the title
#   details what to do (plain text; links welcome)

items:

