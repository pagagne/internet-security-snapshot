- id: risk-r10-expiry-check
  owner: author
  title: Check the key register's expiry dates (R10)
  date: 2026-11-27
  time: "10:00"
  minutes: 15
  done: "18 Nov 2026 (done early, author): all keys checked; dates in SOP section 10 and the key register; renewal reminders 30 Dec 2026 (private-repository token) and 12 Apr 2027 (OpenRouter)"
  details: >
    Look up each key's expiry on its service's own page (Claude cannot see them) and tell Claude
    what you find; never paste or read out a key. Steps per key (written 17 Nov 2026):
    (1) ransomware.live (RANSOMWARE_LIVE_KEY): done 17 Nov, the portal shows no expiry ("none
    stated"); limits 60 a minute, 500,000 a month.
    (2) NVD (NVD_API_KEY): NVD has no account page and publishes no expiry. Nothing to look up:
    record "none stated". Two things end a key: requesting a new key with the same email
    deactivates the old one, so never request another; and NVD may block keys that break its
    limits. A dead key would show as an NVD error in the next quarterly pull (the 1 Dec dry run).
    (3) VulnCheck (VULNCHECK_TOKEN): sign in at vulncheck.com, open the account's API tokens
    page and note each token's status and last-used date (17 Nov: the 20 Oct token showed last
    activity 28 days ago; a new one was made and stored the same day). VulnCheck expires any
    token not used for 30 days; a keep-alive request now runs on the 1st-2nd and 15th-16th of each month (and
    once on 17-18 Nov), so the token should show as used recently.
    (4) Cloudflare (CLOUDFLARE_TOKEN): done 18 Nov, "Read Cloudflare Radar data" is active
    (Account.Radar, created 21 Oct, last used early November), no expiry set.
    (5) Google backup: done 18 Nov, rclone is listed (access given 27 Oct 2026, full Google
    Drive access). Background: (RCLONE_CONF, the Drive sign-in used by Backup and Research): it has no
    expiry date. It stops working only if you remove its access in your Google Account's
    third-party connections, if it goes unused for six months, or if the Google Cloud app it
    uses is in "Testing" (then 7 days; ours has worked since October, so it is not). Look in
    your Google Account's security page, third-party connections, that the rclone access is
    still listed. BigQuery uses no stored key (GitHub proves its identity to Google each run),
    so there is nothing to check there.
    (6) GitHub private-repository token (MANUAL_REPO_TOKEN): done 18 Nov, the only token is the
    fine-grained "snapshot-manual publish", expiring Fri 29 Jan 2027 (no classic tokens);
    renewal reminder 30 Dec 2026.
    (7) OpenRouter: done 17 Nov (expires 12 May 2027; reminder 12 Apr 2027).
    (8) GreyNoise (GREYNOISE_API_KEY): done 17 Nov, no expiry shown ("none stated").
    Full requirements per key: docs/SOP_MANUAL_RUNS.md, section 10.
    Tell Claude the results; Claude records them in the key register and schedules any renewal
    30 days ahead.

