- id: permission-follow-ups
  owner: author
  title: Data-permission follow-ups
  date: 2026-11-20
  time: "09:00"
  minutes: 30
  details: >
    Claude drafts follow-ups for any of ransomware.live (ticket #3425), VulnCheck
