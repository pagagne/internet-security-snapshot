    case: PHP2Shell (fixed 21 Oct 2026; author's concern of 26 Oct that many servers will stay
    unpatched): from the X-Powered-By PHP versions in the September, October and November
    crawls, the share of PHP-reporting sites on a fixed release, and the share on releases
    that will never get a fix (PHP 5.4-7.3). Sites that hide their version are not counted.

