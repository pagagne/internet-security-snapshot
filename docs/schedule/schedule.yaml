    definition in plain words, the inputs as a CSV a spreadsheet opens, the steps from inputs
    to figure, and the published value to match, listed in site/reviewer/worksheets.json for
    the Reviewer's Desk (whose seeded draw picks three). Test on the Q4 2026 pilot (provisional 1 Jan) so a
    worksheet can be tried in the practice round. Check that each worksheet can be followed in
    a spreadsheet with no code.

- id: reviewer-credit
  owner: claude
  title: Record the confirmed reviewer
  date: 2027-03-02
  details: >
    Add the reviewer as a contributor (name or initials as they asked, ORCID) to .zenodo.json
    and the report template; record their disclosed ties for publication beside the review.
    Never put their email or phone in the public repository.

- id: reviewer-practice-send
  owner: claude
  title: Send the reviewer the practice second-coder sheet (pilot quarter)
  date: 2027-03-02
  feeds: [reviewer]
  details: >
    python -m snapshot.agreement sample --batch 2026Q4; send the sheet (not the weights file)
    and the written rules. Unscored practice; score it only to discuss on the onboarding call.

- id: reviewer-orientation
  owner: reviewer
  title: Getting started - read the overview, plan and statistical review
  date: 2027-03-02
  days: 13
  details: >
    About 3-4 hours including the call. docs/HOW_IT_WORKS.md (the overview), the registered
    plan (OSF DOI 10.17605/OSF.IO/3XT82, and prereg/ in the repository),
    docs/STATISTICAL_REVIEW_2026-10-24.md. Can start in February if you confirm early.

- id: reviewer-practice
  owner: reviewer
  title: Optional - practice round as second coder (pilot quarter)
  date: 2027-03-02
  days: 13
  details: >
    About 45 minutes, not scored. 20 items from the Q4 2026 pilot with Paul's answers removed:
    mostly fix dates (open the vendor's advisory, record when the fix was released).

- id: reviewer-onboarding
  owner: author
  title: Onboarding call with the external reviewer
  date: 2027-03-04
  time: "10:00"
  minutes: 60
  feeds: [reviewer]
  details: >
    Walk through the repository, the hand-check rules and the second-coder sheet; answer
    questions; go over the practice round if done. Move the time to suit the reviewer.

- id: reviewer-annual-review
  owner: reviewer
  title: Optional - join the 2027 annual review
  date: 2027-03-15
  time: "11:00"
  minutes: 90
  details: Video call; the one time each year the scored rules may change. Comments welcome beforehand.

- id: reviewer-packet
  owner: claude
  title: Send the reviewer the Q1 2027 review packet
  date: 2027-04-02
  feeds: [reviewer]
  details: >
    Once the provisional Q1 2027 report is approved: links to the report, the registered plan,
    prereg/DEVIATIONS.md, the data bundle and the exact code commit; the worksheet for every
    headline figure; the sample of hand decisions with their rules; a short review template
    (holds up / doesn't / would change). Before sending, list in site/reviewer/worksheets.json
    ("draw_from") the headline figures actually reported this quarter and add their
    worksheets; the reviewer draws three on the Reviewer's Desk with a seed of their own
    (anyone can repeat it). Never choose the figures.

- id: reviewer-check-in
  owner: author
  title: Optional mid-review check-in with the reviewer
  date: 2027-04-15
  time: "10:00"
  minutes: 30
  feeds: [reviewer]
  details: Answer questions; confirm the review will arrive by 28 April or agree a new date.

- id: review-response
  owner: author
  title: Write the response to the external review
  date: 2027-04-29
  minutes: 60
  details: >
    Point by point; anything accepted becomes a deviations-log row or an item for the next
    annual review. The review itself is published unedited.

- id: review-publish
  owner: claude
  title: Publish the external review beside the Q1 2027 final report
  date: 2027-05-01
  feeds: [reviewer]
  details: >
    Review unedited, the author's response, the reviewer's disclosed ties and credit; archived
    with the release (Zenodo). Send the reviewer the link.

- id: reviewer-second-coder
  owner: reviewer
  title: Second coder - 20 blinded items
  repeat: {months: [1, 4, 7, 10], day: 29, from: 2027-04, until: 2028-01}
  days: 14
  details: >
    About 45 minutes, one sitting, within two weeks. Paul's answers are removed; written rules
    cover each case. Your answers never change his; they measure agreement, published each
    quarter.

- id: second-coder-score
  owner: claude
  title: Score the second coder's sheet; publish agreement
  repeat: {months: [2, 5, 8, 11], day: 13, from: 2027-05, until: 2028-02}
  details: >
    python -m snapshot.agreement score on the returned sheet; agreement rates (with Gwet's AC1)
    go into the next report. If the sheet has not come back, comment on the issue so the
    author can send a reminder; do not contact the reviewer directly.

- id: reviewer-annual-check
  owner: reviewer
  title: Optional - comment on the first annual check
  date: 2028-03-02
  days: 13
  details: >
    About 1-2 hours. Read the first annual check of the free data against better reference
    data (drafted 1 March) and comment before the 15 March 2028 annual review.

