- id: baseline-hand-check-2
  owner: author
  title: Baseline-year hand check, part 2 of 2
  date: 2026-11-24
  time: "10:00"
  minutes: 75
  details: Slot (c) internet-facing checks and fix dates for the 12 baseline months.

- id: race-list-ready
  owner: claude
  title: Race fix-date list ready in the Hand Check app
  date: 2026-11-25
  details: >
    List builder in snapshot.review, report table and time estimate, alongside
