  news: "VulnCheck agrees to the study's use of its exploited-flaw list"
- when: 17 Nov 2026
  text: GreyNoise Research Community Access granted (X28; credit "Data provided by GreyNoise")
  news: "GreyNoise grants research access to its attack-sensor data"
- when: 17 Nov 2026
  text: Validation passed, 4 of 5 reference cases (review/VALIDATION_RESULT.md)
  news: "Validation check passed, 4 of 5 reference cases"
- when: 18 Nov 2026
  text: GreyNoise agrees to a weekly collection and a private six-month history of daily counts
  news: "GreyNoise agrees to weekly collection of attack counts"
- when: 19 Nov 2026
