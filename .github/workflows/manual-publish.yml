name: Manual publish (private)

# The Snapshot, the study manual, is part of the report and is not public before it (author's
# decision, 30 Oct 2026). It is built here from the public working documents and pushed to the
# author's private repository pagagne/snapshot-manual, where it is read on GitHub (contents page
# with dropdowns, one file per part). Needs the MANUAL_REPO_TOKEN secret: a fine-grained token
# with Contents read and write on that one repository only. Nothing is written to this
# repository. Since 31 Oct 2026 the private repository also holds the exploratory work
# (exploratory/, runs/; tools/private.sh): the manual's Part III is built from there, and this
# workflow replaces only README.md and docs/ in it. The sweep workflows start it through
# repository_dispatch (manual-publish) after they save, so the manual follows the private data.
on:
  push:
    branches: [main]
    paths: ["**.md", "config/manual.yaml", "src/snapshot/manual.py", "tools/manual_publish.py",
            "docs/diagrams/**", "src/snapshot/x25report.py", "src/snapshot/x3catalogue.py"]
  repository_dispatch:
    types: [manual-publish]
  workflow_dispatch:
    inputs:
      about:
        description: "Rebuilds The Snapshot manual and copies it to your private repository snapshot-manual (only you can see it). Changes nothing in this repository."
        required: false
        default: "ok"

permissions:
  contents: read

concurrency:
  group: manual-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 15
    steps:
      - name: Token present?
        id: tok
        env:
          HAVE: ${{ secrets.MANUAL_REPO_TOKEN != '' }}
        run: |
          if [ "$HAVE" != "true" ]; then echo "::warning title=Manual not published::MANUAL_REPO_TOKEN secret missing (docs/OPERATIONS.md)"; echo "skip=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        if: steps.tok.outputs.skip != 'yes'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        if: steps.tok.outputs.skip != 'yes'
        with:
          python-version: "3.12.15"   # pinned; upgrades are deliberate and logged
      - if: steps.tok.outputs.skip != 'yes'
        run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Build and copy to the private repository
        if: steps.tok.outputs.skip != 'yes'
        env:
          MANUAL_REPO_TOKEN: ${{ secrets.MANUAL_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tools/private.sh checkout /tmp/private
          [ -f exploratory/ai_attack_campaigns.csv ] || { echo "::notice::Private repository not yet holding the exploratory work (Private move); manual not rebuilt."; exit 0; }
          python -m snapshot.x3catalogue build > /dev/null   # generated reports, rebuilt in the private copy
          python -m snapshot.x25report build > /dev/null
          SNAPSHOT_REQUIRE_PRIVATE=1 python -m snapshot.manual build
          rm -rf /tmp/private/docs /tmp/private/README.md   # the manual only; exploratory/ and runs/ stay
          python tools/manual_publish.py /tmp/private
          tools/private.sh save /tmp/private "Manual from internet-security-snapshot@${GITHUB_SHA::7}"
