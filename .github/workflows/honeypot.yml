name: Honeypot capture

# Monthly capture of the SANS Internet Storm Center web-honeypot files as aggregates only
# (exploratory X14, context only, src/snapshot/collect/isc_honeypot.py). The two files (about
# 1 GB) are summarised on the runner and discarded; each capture saves about 40 KB of counts,
# never a URL or IP address. Monthly, to keep the load on ISC low (author's decision, 25 Oct). Results go to the
# private repository pagagne/snapshot-manual under runs/data/isc-honeypot/ (author's decision,
# 31 Oct 2026: exploratory sweeps are private; this public log carries counts only). Credit: SANS Technology Institute, Internet
# Storm Center, https://isc.sans.edu (attribution required, no reselling).
on:
  schedule:
    - cron: "43 9 2 * *"   # the 2nd of each month, 09:43 UTC, after ISC's daily update (one cron field only: day-of-month and day-of-week together would mean either)
  # No Run button (author's decision, 29 Oct 2026): this workflow contacts sources outside the
  # repository, so it starts only on its timer or through GitHub's API (repository_dispatch),
  # e.g. from the Schedule workflow or Claude. See docs/WORKFLOWS.md.
  repository_dispatch:
    types: [honeypot]

permissions:
  contents: write   # run log on the run-reports branch (status only)

jobs:
  capture:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12.15"   # pinned; upgrades are deliberate and logged
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Capture (aggregates only; nothing printed here)
        run: |
          set +e; python -m snapshot.collect.isc_honeypot --out honeypot-out > capture.log 2>&1; rc=$?; set -e
          echo "Honeypot capture: exit $rc; $(ls honeypot-out 2>/dev/null | wc -l) files saved to the private repository." | tee summary.md; exit $rc
      - name: Save to the private repository
        env:
          MANUAL_REPO_TOKEN: ${{ secrets.MANUAL_REPO_TOKEN }}
        run: |
          day=$(date -u +%Y-%m-%d)
          tools/private.sh checkout /tmp/private
          mkdir -p "/tmp/private/runs/data/isc-honeypot/$day"
          cp honeypot-out/* capture.log "/tmp/private/runs/data/isc-honeypot/$day/"
          tools/private.sh save /tmp/private "Honeypot capture $day"
      - name: Record the run (run-reports branch)
        if: always()
        run: tools/run_log.sh "Honeypot capture" "${{ job.status }}" summary.md
