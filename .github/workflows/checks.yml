name: Checks

# Runs the tests, including the locked-core guard, on every push and pull request, and by hand
# ("Run workflow" button, added 29 Oct 2026 at the author's request).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12.15"   # pinned; upgrades are deliberate and logged
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - run: pytest -q
      - name: Schedule outputs up to date?
        # docs/ANNUAL_PLAN.md and the calendar feed must match docs/schedule/schedule.yaml.
        run: python -m snapshot.schedule check
      - name: Privacy scan
        # Fails if a key, token, personal contact detail or not-yet-publishable figure is in the
        # repository (docs/OPERATIONS.md, "Private by design").
        run: python -m snapshot.privacy
      - name: Diagrams up to date?
        # Warns (never fails) when a file a diagram depends on changed since it was reviewed.
        run: python -m snapshot.diagrams check

  container:
    # Builds the pinned analysis container and runs the test suite inside it, so the image
    # the rebuild check uses is known to work on every change.
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Build
        run: docker build -t snapshot-env:${{ github.sha }} .
      - name: Tests inside the container
        run: docker run --rm snapshot-env:${{ github.sha }}
      - name: Image ID
        run: echo "Image $(docker image inspect --format '{{.Id}}' snapshot-env:${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"
