name: Checks

# Runs the tests, including the locked-core guard, on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12.15"   # pinned; upgrades are deliberate and logged
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - run: pytest -q
      - name: Diagrams up to date?
        # Warns (never fails) when a file a diagram depends on changed since it was reviewed.
        run: python -m snapshot.diagrams check
