name: Research probe

# Manual research runs (docs/RESEARCH_PLAN.md). Results go to the run-reports branch under
# research/. Uses only public sources; no secrets.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Probe to run"
        type: choice
        options: [fixdate_probe, source_scout, honeypot_capture, kev_lag, kernel_fixdates, depsdev_adoption, hhs_breaches, ai_lists]
        default: fixdate_probe
      start:
        description: "First KEV date-added (YYYY-MM-DD)"
        default: "2026-04-01"
      end:
        description: "Last KEV date-added (YYYY-MM-DD)"
        default: "2026-09-30"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12.15"   # pinned; upgrades are deliberate and logged
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m snapshot.research.${{ inputs.task }} --start ${{ inputs.start }} --end ${{ inputs.end }} --out research-out 2>&1 | tee research-out.log
      - name: Publish
        if: always()
        run: |
          dest="research/$(date -u +%Y-%m-%dT%H%MZ)-${{ inputs.task }}"
          git fetch origin run-reports:run-reports
          git worktree add -q /tmp/rr run-reports
          mkdir -p "/tmp/rr/$dest"
          cp -r research-out/. "/tmp/rr/$dest/" 2>/dev/null || true
          cp research-out.log "/tmp/rr/$dest/" 2>/dev/null || true
          cd /tmp/rr
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Research ${{ inputs.task }} ${{ github.run_id }}" && git push -q origin run-reports
