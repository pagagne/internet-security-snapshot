name: Schedule

# Every morning: opens a GitHub issue for each author or Claude action item that falls due
# (docs/schedule/schedule.yaml), and starts any scheduled run that has no cron of its own
# (for example the 1 December dry run). Issues are the study's to-do list, readable by the
# author and by any Claude session, so nothing depends on one chat (docs/OPERATIONS.md).
on:
  schedule:
    - cron: "23 10 * * *"  # 10:23 UTC = 06:23 ET (05:23 in winter time)
    - cron: "7 12 * * *"   # 12:07 UTC = 07:07 ET
    - cron: "37 15 * * *"  # 15:37 UTC = 10:37 ET
    # Three timers because GitHub drops scheduled runs at busy times (it skipped the 12:07 run
    # on 25 and 26 Oct 2026). The job opens each issue only once, so extra runs change nothing.
    # Last safety net: the daily Claude work queue (08:32 ET) starts this workflow by hand if
    # no run has succeeded that day (docs/OPERATIONS.md).
  workflow_dispatch:
    inputs:
      date:
        description: "Pretend today is this date (YYYY-MM-DD); blank = today"
        required: false
      dry_run:
        description: "List what would happen without doing it"
        type: boolean
        default: false

permissions:
  contents: write   # run log on the run-reports branch only
  issues: write
  actions: write

jobs:
  act:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12.15"   # pinned; upgrades are deliberate and logged
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create schedule --color 5319e7 --description "Opened by the Schedule workflow" --force
          gh label create owner:author --color d93f0b --description "For the author" --force
          gh label create owner:claude --color 0e8a16 --description "For a Claude session" --force
          gh label create owner:github --color 1d76db --description "Automatic GitHub run" --force
      - name: Open due issues and start due runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m snapshot.schedule act $ARGS | tee act.txt | tee -a "$GITHUB_STEP_SUMMARY"
          grep -qx "nothing due" act.txt && : > act.txt || true
      - name: Record the run (run-reports branch)
        if: always()
        run: tools/run_log.sh Schedule "${{ job.status }}" act.txt
