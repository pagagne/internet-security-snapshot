name: Diagrams

# Redraws the PNG copies in docs/diagrams/ whenever a diagram's Mermaid source changes,
# so the pictures always match the version GitHub shows in docs/EVALUATION_FLOW.md.
on:
  push:
    branches: [main]
    paths: ["docs/diagrams/*.mmd"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagrams
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22"
      - name: Install Mermaid renderer
        run: npm install -g @mermaid-js/mermaid-cli@11.4.2
      - name: Render PNGs
        run: |
          echo '{"args":["--no-sandbox"]}' > /tmp/pp.json
          for f in docs/diagrams/*.mmd; do
            mmdc -i "$f" -o "${f%.mmd}.png" -s 2 -b white -p /tmp/pp.json
          done
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagrams/*.png
          if git diff --cached --quiet; then echo "PNGs already up to date."; exit 0; fi
          git commit -qm "Redraw diagram PNGs from Mermaid source"
          git push -q origin HEAD:main || echo "::warning title=Diagram PNGs not pushed::The push to main was refused (ruleset?). Download the 'diagram-pngs' artifact instead."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: diagram-pngs
          path: docs/diagrams/*.png
          retention-days: 30
