name: Diagrams

# Renders the PNG copies of docs/diagrams/*.mmd whenever a Mermaid source changes and attaches
# them to the run as a download, as a cross-check. It no longer pushes: main requires passing
# Checks (ruleset of 27 Oct) and workflows cannot bypass it on a personal repository, so the
# PNGs are rendered and committed together with the source change (author's decision, 27 Oct).
on:
  push:
    branches: [main]
    paths: ["docs/diagrams/*.mmd"]
  workflow_dispatch:
    inputs:
      about:
        description: "What this does (information only, leave ticked): Redraws the diagram pictures from their Mermaid sources and attaches them to the run as a download, for comparison. Read only; changes nothing."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: diagrams
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22"
      - name: Install Mermaid renderer
        run: npm install -g @mermaid-js/mermaid-cli@11.4.2
      - name: Render PNGs
        run: |
          echo '{"args":["--no-sandbox"]}' > /tmp/pp.json
          for f in docs/diagrams/*.mmd; do
            mmdc -i "$f" -o "${f%.mmd}.png" -s 2 -b white -p /tmp/pp.json
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6 (same pin as the quarterly pull; v4 ran on deprecated Node.js 20)
        if: always()
        with:
          name: diagram-pngs
          path: docs/diagrams/*.png
          retention-days: 30
