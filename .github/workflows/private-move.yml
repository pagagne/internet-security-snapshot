name: Private move (one-off)

# One-off move of the exploratory work to the private repository pagagne/snapshot-manual
# (author's decision, 31 Oct 2026: "any sweeps that are in addition to the core sweeps should go
# into the private manual repo … data, analysis and reports"). Runs on the push that removes
# exploratory/ from this repository: copies exploratory/ as it stood in the commit before, and
# the exploratory results on the run-reports branch (research/ runs of the exploratory tasks,
# data/isc-honeypot/), into the private repository. Refuses to run once the private copy holds
# the attack log, so it can never overwrite later work. Prints counts only.
on:
  push:
    branches: [main]
    paths: [".github/workflows/private-move.yml"]

permissions:
  contents: write   # the run log on the run-reports branch (counts only)

concurrency:
  group: private-move
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
      - name: Copy to the private repository
        env:
          MANUAL_REPO_TOKEN: ${{ secrets.MANUAL_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git fetch -q origin +refs/heads/run-reports:refs/remotes/origin/run-reports
          last=$(git rev-list -1 HEAD -- exploratory/ai_attack_campaigns.csv)
          src="$last"; git cat-file -e "$last:exploratory/ai_attack_campaigns.csv" 2>/dev/null || src="$last^"
          echo "exploratory/ taken from $(git rev-parse --short "$src")"
          git clone -q "https://x-access-token:${MANUAL_REPO_TOKEN}@github.com/pagagne/snapshot-manual.git" /tmp/private
          if [ -f /tmp/private/exploratory/ai_attack_campaigns.csv ]; then echo "Already moved; nothing done."; exit 0; fi
          mkdir -p /tmp/private/runs
          git archive "$src" exploratory | tar -x -C /tmp/private
          mkdir -p /tmp/stage && git archive origin/run-reports research data/isc-honeypot | tar -x -C /tmp/stage
          mkdir -p /tmp/private/runs/research /tmp/private/runs/data
          for d in /tmp/stage/research/*; do
            b=$(basename "$d")
            if [[ "$b" =~ -(ai_lists|ai_tools|cve_check|honeypot_capture|x3_sources|github_tools|repo_scout|hf_tools|x3_read|feed_verify|feed_screen)$ || "$b" = X25_REMOVED.md ]]; then
              cp -r "$d" /tmp/private/runs/research/
            fi
          done
          cp -r /tmp/stage/data/isc-honeypot /tmp/private/runs/data/ 2>/dev/null || true
          echo "exploratory files: $(find /tmp/private/exploratory -type f | wc -l); run folders: $(ls /tmp/private/runs/research | wc -l); honeypot files: $(find /tmp/private/runs/data -type f | wc -l)" | tee counts.txt
          tools/private.sh save /tmp/private "Exploratory work moved from internet-security-snapshot@${GITHUB_SHA::7} (author's decision, 31 Oct 2026)"
      - name: Record the run (run-reports branch)
        if: always()
        run: |
          [ -f counts.txt ] || echo "no counts" > counts.txt
          tools/run_log.sh "Private move" "${{ job.status }}" counts.txt
