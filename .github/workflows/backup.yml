name: Backup to Google Drive

# Private backup in the author's Google Drive folder Snapshot-backup (since 18 Nov 2026; before that
# Internet-Security-Snapshot-2027, kept as the archive). rclone may touch only files it created there
# (drive.file permission, risk safeguard R27; exploratory/docs/BACKUP.md): a monthly copy of the whole
# repository, and a connection test when run by hand. Each quarterly pull backs up its own full
# bundle (including private data) in its last step. Needs the RCLONE_CONF secret (set up by the author);
# without it the job only reports that the backup is not configured.
on:
  schedule:
    - cron: "17 10 3 * *"   # monthly repository copy, the 3rd at 10:17 UTC
    - cron: "17 10 * * 0"   # weekly copy, Sundays (author, 18 Nov 2026: a lost GitHub account would cost at most a week of private work); skipped on pull days
  workflow_dispatch:
    inputs:
      about:
        description: "What this does (information only, leave ticked): Saves a complete copy of the repository (all branches and history), of your private repository snapshot-manual, and The Snapshot manual (Markdown) to your Google Drive folder Snapshot-backup, plus a small test file proving the connection works. Contacts only your own Drive."
        type: boolean
        default: true

permissions:
  contents: read
  actions: read   # list runs and download logs and stored outputs before GitHub deletes them (18 Nov 2026)

jobs:
  backup:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 60
    env:
      HAVE_CONF: ${{ secrets.RCLONE_CONF != '' }}
    steps:
      - name: Not on a pull day (weekly timer only)
        if: github.event.schedule == '17 10 * * 0'
        run: |
          case "$(date -u +%d)" in 01|02) echo "SKIP_PULL_DAY=true" >> "$GITHUB_ENV"; echo "Pull day: the weekly copy is skipped (the monthly one runs on the 3rd).";; esac
      - name: Configured?
        run: |
          if [ "$HAVE_CONF" != "true" ]; then
            echo "::warning title=Backup not configured::RCLONE_CONF secret missing; see exploratory/docs/BACKUP.md"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        if: env.HAVE_CONF == 'true' && env.SKIP_PULL_DAY != 'true'
        with:
          fetch-depth: 0
      - name: rclone
        if: env.HAVE_CONF == 'true' && env.SKIP_PULL_DAY != 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Connection test
        if: env.HAVE_CONF == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          echo "Backup connection test from run $GITHUB_RUN_ID at $(date -u +%FT%TZ)" > connection-test.txt
          rclone copyto connection-test.txt "gdrive:tests/connection-test-$(date -u +%Y-%m-%dT%H%MZ).txt"
          rclone lsf gdrive:   # top-level folder names only
      - name: Repository copy
        if: env.HAVE_CONF == 'true' && env.SKIP_PULL_DAY != 'true'
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          name="internet-security-snapshot-$(date -u +%Y-%m-%d).bundle"
          git bundle create "$name" --all
          rclone copy "$name" gdrive:repository/
          echo "Repository copy $name: $(du -h "$name" | cut -f1)"
      - name: Private repository copy (manual and exploratory work)
        # Author's decision 31 Oct 2026: every sweep in addition to the core lives in the private
        # repository pagagne/snapshot-manual; a full copy of it (all history) goes to private-repository/.
        if: env.HAVE_CONF == 'true' && env.SKIP_PULL_DAY != 'true'
        env:
          MANUAL_REPO_TOKEN: ${{ secrets.MANUAL_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$MANUAL_REPO_TOKEN" ] || { echo "::warning::MANUAL_REPO_TOKEN missing: private repository not copied"; exit 0; }
          tools/private.sh checkout /tmp/private
          name="snapshot-manual-$(date -u +%Y-%m-%d).bundle"
          git -C /tmp/private bundle create "$PWD/$name" --all
          rclone copy "$name" gdrive:private-repository/
          echo "Private repository copy: $(du -h "$name" | cut -f1)"
      - name: Manual copy (The Snapshot, Markdown)
        # Author's decision 31 Oct 2026: the manual is kept as Markdown only, no PDFs. A copy of
        # the built manual (single file, parts and contents page) goes to manual/ in Drive,
        # replacing the previous copy. Its private appendix stays in Drive (manual/private/).
        if: env.HAVE_CONF == 'true' && env.SKIP_PULL_DAY != 'true'
        run: |
          set -euo pipefail
          pip install -q --require-hashes -r requirements.lock && pip install -q --no-deps -e .
          SNAPSHOT_REQUIRE_PRIVATE=1 python -m snapshot.manual build >/dev/null   # never committed (author, 30 Oct 2026); Part III from the private checkout
          rclone copyto docs/manual/THE_SNAPSHOT.md gdrive:manual/THE_SNAPSHOT.md
          rclone copyto docs/manual/README.md gdrive:manual/README.md
          rclone sync docs/manual/parts gdrive:manual/parts
          echo "Manual copied to Drive (manual/)."
      - name: Save logs and outputs before GitHub deletes them (90 days)
        # Added 18 Nov 2026 (author, risk safeguard R26): each run log is saved to Drive (logs/)
        # once it is 75 days old, and any quarterly-pull bundle not already on Drive is copied
        # (runs/artifact-<run id>/). Diagram pictures are rebuilt on every change and not kept.
        if: env.HAVE_CONF == 'true' && env.SKIP_PULL_DAY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pip install -q --require-hashes -r requirements.lock >/dev/null 2>&1 || true
          pip install -q --no-deps -e . >/dev/null
          since=$(date -u -d '-91 days' +%Y-%m-%d)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100&created=>$since" --jq '[.workflow_runs[]|{id,status,created_at,name}]' | jq -s 'add' > /tmp/runs.json
          rclone lsf -R --files-only gdrive:logs/ > /tmp/archived.txt 2>/dev/null || : > /tmp/archived.txt
          n=0
          for id in $(python -m snapshot.archive logs /tmp/runs.json /tmp/archived.txt); do
            month=$(jq -r --arg id "$id" '.[]|select((.id|tostring)==$id)|.created_at[0:7]' /tmp/runs.json)
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/logs" > "/tmp/$id.zip" 2>/dev/null; then
              rclone copyto "/tmp/$id.zip" "gdrive:logs/$month/$id.zip"; n=$((n+1))
            fi
            rm -f "/tmp/$id.zip"
          done
          echo "Run logs saved to Drive: $n"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[]|{id,name,created_at,expired}]' | jq -s 'add' > /tmp/arts.json
          rclone lsf --dirs-only gdrive:runs/ > /tmp/drive-runs.txt 2>/dev/null || : > /tmp/drive-runs.txt
          m=0
          for aid in $(python -m snapshot.archive artifacts /tmp/arts.json /tmp/drive-runs.txt); do
            name=$(jq -r --arg a "$aid" '.[]|select((.id|tostring)==$a)|.name' /tmp/arts.json)
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > "/tmp/$aid.zip"
            rclone copyto "/tmp/$aid.zip" "gdrive:runs/artifact-${name#snapshot-}/$name.zip"; m=$((m+1))
            rm -f "/tmp/$aid.zip"
          done
          echo "Pull bundles copied to Drive (were missing): $m"
      - name: Restore test (download the copies back and check them)
        # Added 12 Nov 2026 (schedule item drive-backup-test): proves each month that the copies in
        # Drive can be restored, not only that they were written. Downloads both bundles back,
        # verifies them, clones each and compares its main branch with the repository's.
        if: env.HAVE_CONF == 'true' && env.SKIP_PULL_DAY != 'true'
        run: |
          set -euo pipefail
          d=$(date -u +%Y-%m-%d); mkdir -p /tmp/restore
          rclone copy "gdrive:repository/internet-security-snapshot-$d.bundle" /tmp/restore/
          git bundle verify "/tmp/restore/internet-security-snapshot-$d.bundle" >/dev/null
          git clone -q "/tmp/restore/internet-security-snapshot-$d.bundle" /tmp/restore/public
          want=$(git rev-parse origin/main); got=$(git -C /tmp/restore/public rev-parse origin/main)
          [ "$want" = "$got" ] || { echo "::error::restored public copy's main $got differs from $want"; exit 1; }
          echo "Public copy restored: main at ${got:0:7}, matches."
          if [ -d /tmp/private/.git ]; then
            rclone copy "gdrive:private-repository/snapshot-manual-$d.bundle" /tmp/restore/
            git bundle verify "/tmp/restore/snapshot-manual-$d.bundle" >/dev/null
            git clone -q "/tmp/restore/snapshot-manual-$d.bundle" /tmp/restore/private
            want=$(git -C /tmp/private rev-parse HEAD); got=$(git -C /tmp/restore/private rev-parse HEAD)
            [ "$want" = "$got" ] || { echo "::error::restored private copy differs"; exit 1; }
            echo "Private copy restored: head at ${got:0:7}, matches."
          fi
      - name: Rebuild test (run the study's checks from the restored copy)
        # Added 18 Nov 2026 (author, risk safeguard R26): proves the Drive copy can actually run,
        # not only that it matches. Runs the full test suite and the plan checks inside the copy
        # restored from Drive, with nothing from the live checkout on the path.
        if: env.HAVE_CONF == 'true' && env.SKIP_PULL_DAY != 'true'
        run: |
          set -euo pipefail
          cd /tmp/restore/public
          python -m venv /tmp/restore/venv && . /tmp/restore/venv/bin/activate
          pip install -q --require-hashes -r requirements.lock && pip install -q --no-deps -e .
          python -m pytest -q 2>&1 | tail -1
          python -m snapshot.schedule check && python -m snapshot.refs check
          echo "Restored copy runs: tests and plan checks pass."
