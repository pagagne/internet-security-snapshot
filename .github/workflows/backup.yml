name: Backup to Google Drive

# Private backup in the author's Google Drive (docs/BACKUP.md): the full bundle of every
# quarterly pull (including private data that may never be published, such as VulnCheck), and
# a monthly copy of the whole repository. Needs the RCLONE_CONF secret (set up by the author);
# without it the job only reports that the backup is not configured.
on:
  workflow_run:
    workflows: ["Quarterly pull"]
    types: [completed]
  schedule:
    - cron: "17 10 3 * *"   # monthly repository copy, the 3rd at 10:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backup:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 60
    env:
      HAVE_CONF: ${{ secrets.RCLONE_CONF != '' }}
    steps:
      - name: Configured?
        run: |
          if [ "$HAVE_CONF" != "true" ]; then
            echo "::warning title=Backup not configured::RCLONE_CONF secret missing; see docs/BACKUP.md"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        if: env.HAVE_CONF == 'true'
        with:
          fetch-depth: 0
      - name: rclone
        if: env.HAVE_CONF == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Quarterly pull bundle
        if: env.HAVE_CONF == 'true' && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p bundle
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D bundle
          sha256sum $(find bundle -type f | sort) > bundle/SHA256SUMS
          rclone copy bundle "gdrive:internet-security-snapshot-backup/runs/$(date -u +%Y-%m-%d)-run$RUN_ID" --transfers 4
          echo "Backed up run $RUN_ID: $(du -sh bundle | cut -f1)"
      - name: Repository copy
        if: env.HAVE_CONF == 'true' && github.event_name != 'workflow_run'
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          name="internet-security-snapshot-$(date -u +%Y-%m-%d).bundle"
          git bundle create "$name" --all
          rclone copy "$name" gdrive:internet-security-snapshot-backup/repository/
          echo "Repository copy $name: $(du -h "$name" | cut -f1)"
