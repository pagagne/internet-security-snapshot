name: Backup to Google Drive

# Private backup in the author's Google Drive folder Internet-Security-Snapshot-2027
# (docs/BACKUP.md; the rclone remote's root_folder_id points at it): a monthly copy of the whole
# repository, and a connection test when run by hand. Each quarterly pull backs up its own full
# bundle (including private data) in its last step. Needs the RCLONE_CONF secret (set up by the author);
# without it the job only reports that the backup is not configured.
on:
  schedule:
    - cron: "17 10 3 * *"   # monthly repository copy, the 3rd at 10:17 UTC
  workflow_dispatch:
    inputs:
      about:
        description: "What this does (information only, leave ticked): Saves a complete copy of the repository (all branches and history) and both editions of The Snapshot manual (PDF) to your Google Drive folder Internet-Security-Snapshot-2027, plus a small test file proving the connection works. Contacts only your own Drive."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 60
    env:
      HAVE_CONF: ${{ secrets.RCLONE_CONF != '' }}
    steps:
      - name: Configured?
        run: |
          if [ "$HAVE_CONF" != "true" ]; then
            echo "::warning title=Backup not configured::RCLONE_CONF secret missing; see docs/BACKUP.md"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        if: env.HAVE_CONF == 'true'
        with:
          fetch-depth: 0
      - name: rclone
        if: env.HAVE_CONF == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Connection test
        if: env.HAVE_CONF == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          echo "Backup connection test from run $GITHUB_RUN_ID at $(date -u +%FT%TZ)" > connection-test.txt
          rclone copyto connection-test.txt "gdrive:tests/connection-test-$(date -u +%Y-%m-%dT%H%MZ).txt"
          rclone lsf gdrive:   # top-level folder names only
      - name: Repository copy
        if: env.HAVE_CONF == 'true'
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          name="internet-security-snapshot-$(date -u +%Y-%m-%d).bundle"
          git bundle create "$name" --all
          rclone copy "$name" gdrive:repository/
          echo "Repository copy $name: $(du -h "$name" | cut -f1)"
      - name: Manual PDFs (The Snapshot)
        # Added 29 Oct 2026 (author): keeps both editions of the study manual in Drive, replacing
        # the previous copy. Public edition from docs/manual/THE_SNAPSHOT.md -> manual/. Private
        # edition adds Appendix C, read from Drive (manual/private/appendix-c.md, never in the
        # repository) -> manual/private/. Nothing private is printed or uploaded anywhere else.
        if: env.HAVE_CONF == 'true'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq qpdf >/dev/null
          pip install -q --require-hashes -r requirements.lock
          pip install -q markdown==3.11 pypdf==6.17.0 playwright==1.63.0   # PDF tools, pinned
          python -m playwright install --with-deps chromium >/dev/null
          python -m snapshot.manual build >/dev/null   # outputs are never committed (author, 30 Oct 2026)
          python tools/manual_pdf.py "$RUNNER_TEMP/The-Snapshot.pdf" >/dev/null
          rclone copyto "$RUNNER_TEMP/The-Snapshot.pdf" gdrive:manual/The-Snapshot.pdf
          echo "Public edition: $(du -h "$RUNNER_TEMP/The-Snapshot.pdf" | cut -f1)"
          if rclone copyto gdrive:manual/private/appendix-c.md "$RUNNER_TEMP/appendix-c.md" 2>/dev/null; then
            python tools/manual_pdf.py "$RUNNER_TEMP/The-Snapshot-PRIVATE.pdf" --private "$RUNNER_TEMP/appendix-c.md" \
              --edition "Private edition - not for publication" >/dev/null
            rclone copyto "$RUNNER_TEMP/The-Snapshot-PRIVATE.pdf" gdrive:manual/private/The-Snapshot-PRIVATE.pdf
            echo "Private edition saved to Drive (manual/private/)."
            rm -f "$RUNNER_TEMP/appendix-c.md" "$RUNNER_TEMP/The-Snapshot-PRIVATE.pdf"
          else
            echo "::notice title=Private edition::No appendix in Drive (manual/private/appendix-c.md); public edition only"
          fi

