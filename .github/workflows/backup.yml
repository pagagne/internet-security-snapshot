name: Backup to Google Drive

# Private backup in the author's Google Drive folder Internet-Security-Snapshot-2027
# (docs/BACKUP.md; the rclone remote's root_folder_id points at it): a monthly copy of the whole
# repository, and a connection test when run by hand. Each quarterly pull backs up its own full
# bundle (including private data) in its last step. Needs the RCLONE_CONF secret (set up by the author);
# without it the job only reports that the backup is not configured.
on:
  schedule:
    - cron: "17 10 3 * *"   # monthly repository copy, the 3rd at 10:17 UTC
  workflow_dispatch:
    inputs:
      about:
        description: "What this does (information only, leave ticked): Saves a complete copy of the repository (all branches and history) and The Snapshot manual (Markdown) to your Google Drive folder Internet-Security-Snapshot-2027, plus a small test file proving the connection works. Contacts only your own Drive."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 60
    env:
      HAVE_CONF: ${{ secrets.RCLONE_CONF != '' }}
    steps:
      - name: Configured?
        run: |
          if [ "$HAVE_CONF" != "true" ]; then
            echo "::warning title=Backup not configured::RCLONE_CONF secret missing; see docs/BACKUP.md"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        if: env.HAVE_CONF == 'true'
        with:
          fetch-depth: 0
      - name: rclone
        if: env.HAVE_CONF == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Connection test
        if: env.HAVE_CONF == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          echo "Backup connection test from run $GITHUB_RUN_ID at $(date -u +%FT%TZ)" > connection-test.txt
          rclone copyto connection-test.txt "gdrive:tests/connection-test-$(date -u +%Y-%m-%dT%H%MZ).txt"
          rclone lsf gdrive:   # top-level folder names only
      - name: Repository copy
        if: env.HAVE_CONF == 'true'
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          name="internet-security-snapshot-$(date -u +%Y-%m-%d).bundle"
          git bundle create "$name" --all
          rclone copy "$name" gdrive:repository/
          echo "Repository copy $name: $(du -h "$name" | cut -f1)"
      - name: Manual copy (The Snapshot, Markdown)
        # Author's decision 31 Oct 2026: the manual is kept as Markdown only, no PDFs. A copy of
        # the built manual (single file, parts and contents page) goes to manual/ in Drive,
        # replacing the previous copy. Its private appendix stays in Drive (manual/private/).
        if: env.HAVE_CONF == 'true'
        run: |
          set -euo pipefail
          pip install -q --require-hashes -r requirements.lock && pip install -q --no-deps -e .
          python -m snapshot.manual build >/dev/null   # outputs are never committed (author, 30 Oct 2026)
          rclone copyto docs/manual/THE_SNAPSHOT.md gdrive:manual/THE_SNAPSHOT.md
          rclone copyto docs/manual/README.md gdrive:manual/README.md
          rclone sync docs/manual/parts gdrive:manual/parts
          echo "Manual copied to Drive (manual/)."
