name: Quarterly pull

on:
  schedule:
    # 06:00 UTC on 1 Jan/Apr/Jul/Oct: provisional run for the quarter just ended
    - cron: "0 6 1 1,4,7,10 *"
    # 06:00 UTC on 1 Feb/May/Aug/Nov: final run for the same quarter
    - cron: "0 6 1 2,5,8,11 *"
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter to pull, e.g. 2026Q4 (blank = most recent ended quarter)"
        required: false
      run:
        description: "Run type"
        type: choice
        options: [dry-run, provisional, final]
        default: dry-run
      sources:
        description: "Comma-separated sources; blank = every source switched on in config/sources.yaml"
        required: false
        default: ""
      epss_step:
        description: "Days between EPSS samples (1 = daily, as in quarterly runs)"
        required: false
        default: "1"

permissions:
  contents: write   # to tag each provisional/final run

concurrency:
  group: quarterly-pull   # one pull at a time; a second waits rather than racing on tags or reports
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-24.04   # pinned; upgrades are deliberate and logged
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12.15"   # pinned; upgrades are deliberate and logged

      - name: Install
        run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .

      - name: Unit tests
        run: pytest -q

      - name: Pull
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          RANSOMWARE_LIVE_KEY: ${{ secrets.RANSOMWARE_LIVE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # VULNCHECK_TOKEN is not passed: VulnCheck data stays private until they confirm in writing.
          # Inputs arrive as environment variables, never pasted into the script (no injection).
          IN_QUARTER: ${{ inputs.quarter }}
          IN_RUN: ${{ inputs.run }}
          IN_SOURCES: ${{ inputs.sources }}
          IN_EPSS_STEP: ${{ inputs.epss_step }}
        run: |
          ARGS=(--out data/raw)
          [[ -z "$IN_QUARTER" || "$IN_QUARTER" =~ ^20[0-9]{2}Q[1-4]$ ]] || { echo "bad quarter"; exit 2; }
          [[ -z "$IN_SOURCES" || "$IN_SOURCES" =~ ^[a-z,]+$ ]] || { echo "bad sources"; exit 2; }
          [[ -z "$IN_EPSS_STEP" || "$IN_EPSS_STEP" =~ ^[0-9]+$ ]] || { echo "bad epss_step"; exit 2; }
          [ -n "$IN_QUARTER" ] && ARGS+=(--quarter "$IN_QUARTER")
          [ -n "$IN_RUN" ] && ARGS+=(--run "$IN_RUN")
          [ -n "$IN_SOURCES" ] && ARGS+=(--sources "$IN_SOURCES")
          [ -n "$IN_EPSS_STEP" ] && ARGS+=(--epss-step "$IN_EPSS_STEP")
          set -o pipefail
          mkdir -p data/raw
          python -m snapshot.pull "${ARGS[@]}" 2>&1 | tee data/raw/pull.log

      - name: Keep private data out of public outputs
        if: always()
        # Sources whose publish switch is off (config/sources.yaml) leave the public bundle,
        # run log and quality report; they go only to the author's private Drive backup.
        # data/private is outside data/raw, so it is never uploaded or published; the backup
        # step at the end sends it to Drive.
        run: python -m snapshot.private data/raw data/private

      - name: Data quality report
        if: always()
        # Writes quality.md/json into each bundle, adds it to the run summary, and posts it
        # as a public notice so it can be read without downloading the bundle.
        run: |
          # Previous run's metrics, for the drift checks
          git fetch -q origin run-reports 2>/dev/null && prev=$(git ls-tree -r --name-only FETCH_HEAD | grep 'quality-.*\.json$' | sort | tail -1)
          if [ -n "$prev" ]; then git show "FETCH_HEAD:$prev" > /tmp/prev-quality.json; fi
          for b in data/raw/*/*/; do
            python -m snapshot.quality "$b" --previous /tmp/prev-quality.json > /dev/null || true
            cat "$b/quality.md" >> "$GITHUB_STEP_SUMMARY"
            python -c "import sys; t=open(sys.argv[1]).read()[:60000]; print('::notice title=Data quality ' + sys.argv[1] + '::' + t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))" "$b/quality.md"
          done

      - name: Review list
        # The author's hand-check list for the quarter: the seeded draw with backups,
        # pre-filled fix dates (GitHub API, via GITHUB_TOKEN) and grouped AI-credit texts.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for b in data/raw/*/*/; do
            q=$(echo "$b" | cut -d/ -f3)
            if [ -f "$b/cve/cve_records.parquet" ]; then
              python -m snapshot.review --cve "$b/cve/cve_records.parquet" --quarter "$q" --out "$b/review-$q.csv" || true
            fi
          done

      - name: Summary
        if: always()
        run: |
          for m in data/raw/*/*/manifest.json; do
            echo "### $m" >> "$GITHUB_STEP_SUMMARY"
            python -c "import json,sys; d=json.load(open('$m')); [print(f\"- {e['source']}: {e['status']} {e.get('file_path') or ''} {e.get('note') or ''}\") for e in d.get('entries', d.get('files', []))]" >> "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Upload frozen bundle
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: snapshot-${{ github.run_id }}
          path: data/raw
          retention-days: 90

      - name: Tag the run
        if: always()   # gaps are recorded in the manifest; the run is still tagged
        # Tags the exact code and config used, e.g. snapshot-2026Q4-provisional.
        # Dry runs are not tagged.
        run: |
          for dir in data/raw/*/*/; do
            run=$(basename "$dir"); quarter=$(basename "$(dirname "$dir")")
            if [ "$run" != "dry-run" ]; then
              tag="snapshot-${quarter}-${run}"
              git tag "$tag" && git push origin "$tag" || echo "tag $tag exists; not moved"
            fi
          done

      - name: Publish run report
        # Saves the log, manifest and quality report to the run-reports branch so they can be
        # read without signing in to GitHub. Secret values are scrubbed first; the data
        # bundle itself is not included. Also keeps the repository active between quarters.
        if: always()
        env:
          S1: ${{ secrets.NVD_API_KEY }}
          S2: ${{ secrets.CLOUDFLARE_TOKEN }}
          S3: ${{ secrets.RANSOMWARE_LIVE_KEY }}
          S4: ${{ secrets.SEC_USER_AGENT }}
          S5: ${{ secrets.VULNCHECK_TOKEN }}
          S6: ${{ secrets.RCLONE_CONF }}
        run: |
          dest="reports/$(date -u +%Y-%m-%dT%H%MZ)-run${{ github.run_id }}"
          git fetch origin run-reports:run-reports 2>/dev/null || true
          git worktree add -q /tmp/rr run-reports 2>/dev/null || { git worktree add -q --detach /tmp/rr && git -C /tmp/rr checkout -q --orphan run-reports && git -C /tmp/rr rm -rqf . ; }
          mkdir -p "/tmp/rr/$dest"
          cp data/raw/pull.log "/tmp/rr/$dest/" 2>/dev/null || true
          for b in data/raw/*/*/; do
            n=$(echo "$b" | cut -d/ -f3,4 | tr / -)
            cp "$b/manifest.json" "/tmp/rr/$dest/manifest-$n.json" 2>/dev/null || true
            cp "$b/quality.md" "/tmp/rr/$dest/quality-$n.md" 2>/dev/null || true
            cp "$b/quality.json" "/tmp/rr/$dest/quality-$n.json" 2>/dev/null || true
            cp "$b"/review-*.csv "/tmp/rr/$dest/" 2>/dev/null || true
          done
          python - "/tmp/rr/$dest" <<'PY'
          import os, pathlib, sys
          secrets = [os.environ.get(k) for k in ("S1", "S2", "S3", "S4", "S5", "S6")]
          for p in pathlib.Path(sys.argv[1]).iterdir():
              t = p.read_text(errors="replace")
              for s in secrets:
                  if s and len(s) > 3:
                      t = t.replace(s, "***")
              p.write_text(t)
          PY
          cd /tmp/rr
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Run report ${{ github.run_id }}"
          for i in 1 2 3 4 5; do git push -q origin HEAD:run-reports && exit 0; sleep $((i * 4)); git pull -q --rebase origin run-reports; done; exit 1

      - name: Backup to the private Drive folder
        # The full bundle (public part, plus the private part kept out of every public output)
        # goes to the author's Drive (docs/BACKUP.md). Done here rather than by a separate
        # workflow, so it also happens for runs started by the Schedule workflow.
        if: always()
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then
            echo "::warning title=Backup not configured::RCLONE_CONF missing; this run's full bundle (and any private data) was not backed up (docs/BACKUP.md)"
            exit 0
          fi
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf && chmod 600 ~/.config/rclone/rclone.conf
          dest="runs/$(date -u +%Y-%m-%d)-run$GITHUB_RUN_ID"
          find data -type f | sort | xargs sha256sum > SHA256SUMS
          rclone copy data/raw "gdrive:$dest/public"
          [ -d data/private ] && rclone copy data/private "gdrive:$dest/private"
          rclone copyto SHA256SUMS "gdrive:$dest/SHA256SUMS"
          rm -f ~/.config/rclone/rclone.conf
          echo "Backed up to Drive: $dest ($(du -sh data | cut -f1))"
