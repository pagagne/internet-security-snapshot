name: Quarterly pull

on:
  schedule:
    # 06:00 UTC on 1 Jan/Apr/Jul/Oct: provisional run for the quarter just ended
    - cron: "0 6 1 1,4,7,10 *"
    # 06:00 UTC on 1 Feb/May/Aug/Nov: final run for the same quarter
    - cron: "0 6 1 2,5,8,11 *"
  workflow_dispatch:
    inputs:
      quarter:
        description: "Quarter to pull, e.g. 2026Q4 (blank = most recent ended quarter)"
        required: false
      run:
        description: "Run type"
        type: choice
        options: [dry-run, provisional, final]
        default: dry-run
      sources:
        description: "Comma-separated sources"
        required: false
        default: "kev,cve,nvd,epss,sec,radar,ransomware"
      epss_step:
        description: "Days between EPSS samples (1 = daily, as in quarterly runs)"
        required: false
        default: "1"

permissions:
  contents: write   # to tag each provisional/final run

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Pull
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          RANSOMWARE_LIVE_KEY: ${{ secrets.RANSOMWARE_LIVE_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # VULNCHECK_TOKEN is not passed: VulnCheck data stays private until they confirm in writing.
        run: |
          ARGS="--out data/raw"
          if [ -n "${{ inputs.quarter }}" ]; then ARGS="$ARGS --quarter ${{ inputs.quarter }}"; fi
          if [ -n "${{ inputs.run }}" ]; then ARGS="$ARGS --run ${{ inputs.run }}"; fi
          if [ -n "${{ inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ inputs.sources }}"; fi
          if [ -n "${{ inputs.epss_step }}" ]; then ARGS="$ARGS --epss-step ${{ inputs.epss_step }}"; fi
          python -m snapshot.pull $ARGS

      - name: Summary
        if: always()
        run: |
          for m in data/raw/*/*/manifest.json; do
            echo "### $m" >> "$GITHUB_STEP_SUMMARY"
            python -c "import json,sys; d=json.load(open('$m')); [print(f\"- {e['source']}: {e['status']} {e.get('file_path') or ''} {e.get('note') or ''}\") for e in d.get('entries', d.get('files', []))]" >> "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Upload frozen bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_id }}
          path: data/raw
          retention-days: 90

      - name: Tag the run
        if: always()   # gaps are recorded in the manifest; the run is still tagged
        # Tags the exact code and config used, e.g. snapshot-2026Q4-provisional.
        # Dry runs are not tagged.
        run: |
          for dir in data/raw/*/*/; do
            run=$(basename "$dir"); quarter=$(basename "$(dirname "$dir")")
            if [ "$run" != "dry-run" ]; then
              tag="snapshot-${quarter}-${run}"
              git tag "$tag" && git push origin "$tag" || echo "tag $tag exists; not moved"
            fi
          done
