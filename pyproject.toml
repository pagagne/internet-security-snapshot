[project]
name = "internet-security-snapshot"
version = "0.1.0"
description = "Quarterly, pre-registered measurement of internet security status from free versioned data"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "pandera>=0.20",
  "lifelines>=0.29",
  "statsmodels>=0.14",
  "ruptures>=1.1",
  "requests>=2.32",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
