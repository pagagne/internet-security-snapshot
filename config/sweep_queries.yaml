# X3 quarterly AI-attack sweep: the ten searches in each sweep language, translated once and
# kept fixed (config/exploratory.yaml, X3 sweep; translated 28 Oct 2026 by Claude, list as of
# 26 Oct per the author's decision of 27 Oct, research review #9). English is the master; product
# names stay in English. Chinese and Russian are run as site searches on the pages listed for those
# countries (zh: FreeBuf, Anquanke, secrss.com, 4hou; ru: Securelist.ru, Habr, BI.ZONE, F6,
# Kaspersky.ru, Anti-Malware, SecurityLab, Xakep), not on the open web (trial of 26 Oct).
# Each candidate records the language it was found in. Changes only at the March review.
