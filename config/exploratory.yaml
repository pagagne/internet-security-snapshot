# Add-on (exploratory) measures. These appear in a separate "Exploratory" section of each
# quarterly report. They never decide an Improving/Worsening or Rising/Falling label and
# never change the cohort. Anything may be added here at any time with a dated entry.
# Promotion to the core happens only at the March annual review (docs/CHANGE_POLICY.md).
version: 1

measures:
  - id: X1
    name: AI-credited share by lab family
    question: Which labs' tools are credited with finding vulnerabilities, and how is that mix shifting?
    sources: [cve]
    added: 2026-10-21
    feeds_labels: false
    status: active

  - id: X2
    name: Watchlist matches
    question: How many credits name tools on the newcomer watchlist that are not yet in the term list?
    sources: [cve]
    added: 2026-10-21
    feeds_labels: false
    status: active

  - id: X3
    name: AI-operated attack campaigns (curated log)
    question: How often are attacks run by AI agents or AI tooling publicly reported, what do they target, and do they use known flaws or bugs that never get a CVE?
    sources: [curated]   # exploratory/ai_attack_campaigns.csv, one row per reported campaign
    added: 2026-10-21
    feeds_labels: false
    status: active
    method: >
      Hand-curated from public reports. A campaign is logged when a security firm,
      government agency or AI lab reports attackers using AI agents or AI tooling in
      intrusions. Counted per quarter by date reported, with entry vector and whether a
      second independent source confirms it. When a campaign names CVEs, the quarter
      also reports how many of its KEV additions are linked to an AI-run campaign.
      Victim names are never recorded. Reporting
      volume reflects attention as well as activity, so counts are read as a lower bound.
      Amended 2026-10-26 (author's decision): a separate category, ai_role
      "evaluation_escape", for an AI model under evaluation (a red-team or capture-the-flag
      test) that reached real systems with no attacker directing it. Such events are logged
      and reported beside the campaigns, with the same fields, but never added to the campaign
      count. First case: Gemini in Irregular's May 2026 test (reported 14 Aug 2026).
      Amended 2026-10-29 (author's decision, after TrendAI's "Not only ARTEX" report): each row
      records ai_evidence, "confirmed" when the reporter shows attacker-side proof of AI use
      (platform logs, prompts, AI-written plans) or "assessed" when it is judged from style or
      indirect signs; rows logged before then are "unrated" until the author's check. Counts are
      reported for all rows and for confirmed rows alone. Every CVE ID recorded in the campaign
      and sweep logs is checked against CVE.org (snapshot.cvecheck, Research task cve_check)
      when rows are added and at each sweep, because AI tools invent identifiers.
      Amended 2026-10-29 (author's decision, review item 13, option B): each row also records
      attack_method (a fixed list in src/snapshot/x3catalogue.py: autonomous_intrusion,
      agent_recon, credential_harvest, ai_planned_human_led, ai_written_tooling,
      ai_system_hijack, compute_theft, ai_social_engineering, evaluation_escape, other) and
      found_via (author, quarterly_sweep, trial_sweep, claude_research). The catalogue of
      attack methods and the register of resources (exploratory/ai_attack_catalogue.md) are
      generated from the log; a test keeps them current.
      Amended 2026-10-29 (author's decision, widening the search): three more channels, each
      a found_via value. (1) feed_screen: a monthly workflow (Feed screen, the 5th) reads the
      feeds in config/feeds.yaml (about 60: vendor research, governments and CERTs, AI labs and
      incident databases, news for leads, and sources in Chinese, Japanese, Korean, Russian,
      German, French and Portuguese) and lists items naming both an AI term and an attack term.
      (2) newsletter: security newsletters sent to the project address, read by Claude twice a
      month. (3) conference: a twice-yearly scan of major conferences' talk lists. All
      candidates are confirmed by the author in the hand-check window; counts stay a lower
      bound, and each channel's start date is reported so growth from wider looking is not
      read as growth in attacks.
    report_sources:
      - Threat-intelligence reports on AI misuse from AI labs (Anthropic, OpenAI, Google GTIG); Anthropic is a conflict of interest and is labeled as such
      - Security vendor and researcher disclosures (e.g. NorForge for Cairn; GreyNoise for the PaperCut agent campaign)
      - Government advisories (CISA, NCSC, ACSC, JPCERT)
      - MITRE ATLAS case studies and the AI Incident Database
      - LLM-agent honeypot research (e.g. Palisade Research's honeypot), as context
      - AI evaluation firms' and labs' incident disclosures (e.g. Irregular; Google), for evaluation_escape
    sweep:   # added 2026-10-26: quarterly web search, so reports outside the usual channels are found
      when: the 2nd of Jan/Apr/Jul/Oct, for the quarter just ended (schedule item ai-incident-sweep)
      by: Claude runs the searches; the author validates each candidate in the hand-check window
      log: exploratory/ai_attack_sweeps.csv   # every candidate found, kept or not, with the reason
      window: reports dated in the quarter; earlier incidents first reported in it count in it
      queries:   # run every quarter unchanged, so sweeps are comparable; additions are dated
        - AI agent cyberattack intrusion
        - attackers used AI agent to exploit vulnerability
        - LLM generated exploit used in the wild
        - autonomous AI hacking campaign
        - AI-assisted ransomware attack
        - threat actors misuse Claude OR Gemini OR ChatGPT OR Copilot report
        - MCP server OR AI agent compromised attack
        - prompt injection attack in the wild data stolen
        - AI coding assistant supply chain attack
        - AI model escaped sandbox OR evaluation environment
      languages: [en, zh, ja, ko, ru, es, pt, de, fr]   # added 2026-10-26: each query also run in
      queries_translated: config/sweep_queries.yaml   # 2026-10-28: the ten queries in each language, fixed
        # (zh and ru searched on those countries' security sites in the page list, not the open web: trial 26 Oct)
        # these languages (translated once and kept fixed); each candidate records the language found in
      also_check:   # fixed pages read every sweep (list fixed 26 Oct 2026; later additions are dated)
        - AI-lab threat reports (Anthropic, OpenAI, Google GTIG, Microsoft)
        - Government advisories mentioning AI (CISA, NCSC, ACSC, JPCERT, CERT-EU, ENISA)
        - MITRE ATLAS case studies and AI Incident Database entries added in the quarter
        - SANS Internet Storm Center handler diaries
        - Vendor research blogs (Mandiant, Palo Alto Unit 42, Cisco Talos, Microsoft Threat Intelligence, CrowdStrike, ESET, Kaspersky Securelist, Check Point Research, Sophos X-Ops, Huntress)
        - AI-security trackers (OWASP GenAI Security Project incidents, AIAAIC repository)
        - AI evaluation firms' and labs' incident disclosures (e.g. Irregular), for evaluation_escape
        - News sites, for leads only (The Record, BleepingComputer, SecurityWeek, Dark Reading)
        - Research blogs outside the US and Europe (added 2026-10-26): AhnLab ASEC (Korea), Qi An Xin and Qihoo 360 (China), Trend Micro and JPCERT/CC (Japan)
        - Chinese security sites (added 2026-10-26 after the trial): FreeBuf, Anquanke, Security Insight (secrss.com), 4hou
        - TrendAI (Trend Micro) Deep Research, English and Japanese editions (added 2026-10-29; the Japanese edition of "Not only ARTEX" came out four days before the English)
        - Japan's National Cybersecurity Office (NCO) alerts and advisories (added 2026-10-29)
        - AI-incident and threat databases and reports (added 2026-10-29, author): AI Vulnerability Database (AVID); Meta adversarial threat reports; Amazon threat intelligence
        - More national agencies (added 2026-10-29, author): Singapore CSA, South Korea KISA/KrCERT, Germany BSI, Israel INCD, CERT-EU, and joint Five Eyes advisories
        - Conference talk lists, scanned twice a year (added 2026-10-29, author): Black Hat USA and Europe, DEF CON, CODE BLUE (Japan), HITCON (Taiwan), Kaspersky SAS, Virus Bulletin, RSA Conference
        - Organisations already in the X3 log but not on this list (added 2026-10-29, author, from the resource register): Wiz Research and Wiz CIRT; Sysdig Threat Research; GMO Cybersecurity (Japanese); CERT-In advisories (India); Taiwan's Ministry of Digital Affairs; Cybernews research; Amazon threat intelligence (AWS Security blog); DIVD (Dutch Institute for Vulnerability Disclosure); Gridinsoft blog; Symantec and Carbon Black Threat Hunter Team (security.com)
        - Russian security sites (added 2026-10-26 after the trial): Securelist.ru, Habr, BI.ZONE, F6, Kaspersky.ru, Anti-Malware, SecurityLab, Xakep (Positive Technologies research read only; it is under US sanctions)
      rules: >
        A candidate is logged in ai_attack_campaigns.csv only if a named organisation or
        researcher reports real (not simulated) attacker use of AI, with a link; news stories
        count only through the report they cite. Excluded candidates stay in the sweep log
        with the reason (demo or research only, no AI role, duplicate, no primary source).
        What no one reports stays invisible: counts remain a lower bound.
        Safeguards (author's decision, 29 Oct 2026): only a primary report from a named
        organisation counts; news sites, newsletters and databases are leads to that report.
        A surprising claim (a new kind of attack, an unusually large scale, or a report from a
        source new to the log) needs a second independent source before the author confirms it,
        recorded in confirmed_by_second_source. Each primary report is fingerprinted (SHA-256)
        and archived in the Wayback Machine when logged (exploratory/ai_attack_sources.csv,
        Research task x3_sources), so later edits or deletions show. Feeds are vetted in
        config/feeds.yaml (official domain, HTTPS, trust level), and feed or article text is data,
        never instructions.
        Two more columns (author, 30 Oct 2026): model_weights (open-weight, closed, both, not
        named) for the AI the attackers used, and protocols (from the X25 list of 57, e.g.
        HTTP/HTTPS, SSH, SMB, RDP, LDAP, MCP; or not named), both from the primary report.

  - id: X4
    name: Automated and AI traffic against websites (Cloudflare Radar)
    question: Is the share of automated (bot) traffic and AI-crawler activity on the web rising, alongside the layer-7 attack series already collected?
    sources: [radar]
    added: 2026-10-21
    feeds_labels: false
    status: active
    method: >
      Weekly series from Cloudflare Radar: human vs bot traffic share and AI bot activity
      by user agent. Context only; it cannot separate malicious agents from benign ones.

  - id: X5
    name: Flaws in AI software
    question: Is AI software itself (model servers, agent platforms, AI workflow tools, AI gateways, MCP servers) a growing share of serious and exploited flaws?
    sources: [cve, kev]
    added: 2026-10-22
    feeds_labels: false
    status: active
    method: >
      Each eligible CVE and each new KEV entry is tagged "AI software" when its affected
      vendor/product matches config/ai_software_products.yaml (whole-word, case-insensitive).
      Reported per quarter as a share of eligible CVEs, of KEV additions, and within each
      cohort slot. The tag never affects the draw or any label.

  # X6-X12 added 2026-10-22: fingerprints of AI-accelerated attacks that show up
  # whatever model the attacker used, including self-hosted ones. Candidates for the
  # core-freeze decision session (docs/CORE_FREEZE_DECISIONS.md).
  - id: X6
    name: Speed in the tail
    question: What share of the quarter's newly exploited flaws were exploited within 1 day and within 7 days of public disclosure?
    sources: [cve, kev]
    added: 2026-10-22
    feeds_labels: false
    status: planned
    method: For KEV additions in the quarter, days from CVE publication to the KEV date (and to earlier exploitation evidence where recorded). Reported as shares at 1 and 7 days.

  - id: X7
    name: Patch to public exploit code
    question: How quickly does public exploit code appear on GitHub after a fix?
    sources: [poc_in_github]   # new free source: nomi-sec/PoC-in-GitHub (git), to be added
    added: 2026-10-22
    feeds_labels: false
    status: planned
    method: For cohort CVEs and KEV additions, days from the vendor fix to the first public proof-of-concept repository indexed by PoC-in-GitHub. Indexed repositories are not all working exploits; reported as an upper-bound timing signal.

  - id: X8
    name: Breadth of exploitation
    question: Are attackers exploiting more different vendors and products, including ones never exploited before?
    sources: [kev]
    added: 2026-10-22
    feeds_labels: false
    status: planned
    method: Per quarter, distinct vendors and products among KEV additions, and how many appear in KEV for the first time.

  - id: X9
    name: Bug types being exploited
    question: Are exploited flaws shifting toward logic, authentication and access-control bugs relative to memory-safety bugs?
    sources: [kev, cve, nvd]
    added: 2026-10-22
    feeds_labels: false
    status: planned
    method: Root-cause class (config/root_cause_map.yaml, with NVD CWEs filling gaps) for KEV additions per quarter. Depends on the root-cause map decision at the freeze session.

  - id: X10
    name: Exploited before a fix existed
    question: How often does exploitation start before a fix is available (zero-day share)?
    sources: [kev, cve, nvd]
    added: 2026-10-22
    feeds_labels: false
    status: planned
    note: Kept exploratory by the author's decision of 2026-10-23 (decision items 0 and 7); promotion candidate at the 15 March 2027 review once a year of data shows it is steady.
    method: Share of KEV additions whose first exploitation evidence precedes the vendor fix date. Fix dates come from the cohort hand check for cohort CVEs and from vendor advisory references otherwise; unknown dates are reported as unknown, never guessed.

  - id: X11
    name: Exposed and hijacked AI servers
    question: Are self-hosted AI servers (e.g. Ollama, LLM gateways) increasingly exposed and attacked?
    sources: [curated, shadowserver]   # honeypot and research reports; Shadowserver if permission arrives
    added: 2026-10-22
    feeds_labels: false
    status: planned
    method: Logged from public honeypot reports and, if available, Shadowserver exposure series for AI services. Context only.

  - id: X12
    name: Open-weight model release log
    question: When do capable models that attackers can run privately become available?
    sources: [curated]   # exploratory/open_model_releases.csv
    added: 2026-10-22
    feeds_labels: false
    status: active
    method: Dated log of open-weight model releases with strong coding or security ability (name, lab, country, licence, size, runs on a laptop). Used only as a timeline for reading changes in other measures.
    amended_2026-10-26: >
      Author's request: measure how fast capable open-weight models are being released
      worldwide, automatically. Added, if the 27 Oct probe shows the data holds up:
      (1) a monthly capture of new model repositories from a fixed list of major labs on the
      Hugging Face Hub (public API: model name, lab, creation date, size; base and instruct
      releases only, community fine-tunes excluded), each lab tagged with its country;
      (2) Epoch AI's public model database (release date, country, open weights) as an
      independent check; (3) a capability bar fixed before the 29 Dec freeze: a model
      counts as "capable" when it scores at or above a set threshold on a public coding or
      security benchmark. Reported each quarter: releases and capable releases per quarter by
      country/region, the cumulative curve and its doubling time, and the gap in months
      between the best open-weight model and the best closed model on the same benchmark.
      History backfilled to January 2023 (author's choice, 26 Oct), so the curve and its
      doubling time are known before the first 2027 report. Measures supply only: who downloads these models and what they do with them cannot be
      seen; changes are read next to the attack-speed fingerprints (X6-X11), never as cause.

  - id: X13
    name: AI-credited versus other serious flaws, whole population
    question: Do flaws credited to AI tools differ from other serious flaws in severity, bug type and how soon they reach CISA KEV?
    sources: [cve, kev, nvd]
    added: 2026-10-24
    feeds_labels: false
    status: planned
    note: >
      Defined on 2026-10-24, before any result is computed (docs/STATISTICAL_REVIEW_2026-10-24.md,
      point 9). Replaces the 12-flaw cohort as the evidence for the registered secondary
      comparison of AI-credited and other CVEs; the registered cohort comparison is still reported.
    method: >
      Population: every CVE meeting the cohort eligibility rule (prereg 7.1 items 2 and 3:
      critical or CVSS >= 8.0, published on the 1st to 25th) in the quarter, backfilled for
      Q4 2025 to Q3 2026. Groups: AI-credited under the narrow (registered, tool named in a
      clear role) and headline (any mention) definitions, each reported. (1) Every quarter:
      CVSS, share allowing remote code execution and root-cause mix, AI-credited versus other,
      with 90% intervals. (2) Pooled over all quarters to date: Kaplan-Meier time from
      publication to first KEV listing, censored at 90 days or the evaluation date, with the
      event count in each group; while the AI-credited group has fewer than 10 events, only the
      count and an exact 95% upper bound on its 90-day listing rate are reported (Q2-Q3 2026:
      0 of 102). (3) From 20 events: Cox model with product slot, vendor type, CVSS and root
      cause, proportional hazards checked with Schoenfeld residuals. Descriptive only: AI tools
      search different code than attackers target, so no difference is read as an effect of AI.

  # ---- added 25 Oct 2026 from the brainstorm (Claude doc "Brainstorm: Data Sources and Process").
  # Defined on 25 Oct; the research probes that tested whether each source works ran the same
  # day on 2026 data, before any quarterly figure is computed with them.
  - id: X14
    name: Honeypot attack activity by category (SANS ISC), context only
    question: Which kinds of web attacks do honeypots see each quarter, and which named CVEs?
    sources: [isc_honeypot]
    added: 2026-10-25
    feeds_labels: false
    status: active
    method: >
      Monthly capture of the SANS Internet Storm Center web-honeypot files as aggregates
      (src/snapshot/collect/isc_honeypot.py): requests and URLs per attack category, and per
      CVE named in a URL or category. Context only (author's decision, 25 Oct 2026): not used
      as a first-attack date, because the probe found only 2 of 246 KEV additions in the data
      and first-seen dates belong to URLs, not flaws. Credit: SANS Technology Institute,
      Internet Storm Center.

  - id: X15
    name: Zero-day check against Project Zero's list
    question: Of the zero-days Google Project Zero lists, how many does the study's free data also class as zero-days?
    sources: [kev, p0_itw]
    added: 2026-10-25
    feeds_labels: false
    status: planned
    method: >
      Each quarter: KEV additions that appear in Project Zero's public "0day In the Wild" sheet
      (24 of 246 in Jan-Sep 2026), and the share of them that X10 classes as exploited on or
      before the fix. A low share shows how far the free data understates zero-days. ENISA EUVD
      and inthewild.io were tested as earlier-attack sources on 25 Oct and dropped (EUVD mirrors
      KEV; inthewild.io has no reports after Dec 2024).

  - id: X16
    name: Patch adoption for open-source flaws (deps.dev)
    question: How fast do dependent packages move off affected versions of attacked open-source flaws?
    sources: [osv, depsdev]
    added: 2026-10-25
    feeds_labels: false
    status: planned
    method: >
      For KEV additions that OSV maps to npm, PyPI, Maven, Go or Cargo packages: share of
      dependents on affected versions 30 and 90 days after the fix (deps.dev BigQuery history;
      a today-only snapshot from the free API until then). Open-source software only.

  - id: X17
    name: Health-sector hacking breaches (HHS OCR)
    question: Is reported hacking harm in US health care rising or falling?
    sources: [hhs_ocr]
    added: 2026-10-25
    feeds_labels: false
    status: active   # author's decision 29 Oct 2026 (research review #11 decided early): hand download
    method: >
      Quarterly count of "Hacking/IT Incident" breaches affecting 500 or more people, and
      people affected, from the public HHS OCR register. Entity names are never stored.
      The portal cannot be read by a script (29 Oct probe: the list and its export appear only
      after browsing in), so the author downloads the public CSV by hand once a quarter in the
      hand-check window (about 5 minutes) and drops it into the chat; Claude reduces it to the
      two counts at once and keeps only those, never the file.

  - id: X18
    name: Outside AI-found lists against the AI-credit counts
    question: How many flaws that outside lists attribute to AI tools do the headline and narrow counts catch?
    sources: [cve, curated]
    added: 2026-10-25
    feeds_labels: false
    status: planned
    method: >
      A dated, hand-entered list of CVEs that labs or verified trackers attribute to AI tools,
      each with its source; share caught by the headline and narrow T7 rules, and share with
      empty credit fields (vendors that credit only in their own advisories). Read with the
      list's own selection bias in mind.


  # Added 26 Oct 2026 at the author's request: views from outside the US and the Five Eyes,
  # because the core sources (CISA KEV, NVD, SEC, HHS) see the internet mostly from the US.
  # Each starts with a probe of the data (schedule item global-probes); status becomes
  # active only if the data holds up.
  - id: X19
    name: National exploitation alerts against CISA KEV
    question: Do other national cyber agencies flag attacked flaws that CISA's list misses, or flag them earlier?
    sources: [national_alerts, kev]
    added: 2026-10-26
    feeds_labels: false
    status: active   # 29 Oct: CERT-FR and JPCERT/CC (terms read); BSI and KrCERT/CC not adopted
    method: >
      Each quarter: CVEs named in active-exploitation alerts from CERT-FR (France), JPCERT/CC
      (Japan), BSI (Germany) and KrCERT/CC (Korea), each with its alert date. Reported: how many
      each agency flagged, the share also in CISA KEV, the share flagged before KEV listed them
      (and by how many days), and those never in KEV. An earlier alert date is also a candidate
      T_exploit date (snapshot.events other_exploit), compared side by side with KEV-only dates;
      it does not replace them in the core.
    agencies_2026_10_28: >
      Research review #3 (approved on its condition 27 Oct): CERT-FR adopted 28 Oct (alert feed
      readable and dated; Licence ouverte). JPCERT/CC adopted 29 Oct: its terms allow quoting with source, document and URL (courtesy
      email to its PR office, sent by the author).
      BSI WID and KrCERT/CC not adopted: their feeds carry advisories and vendor notices, not
      exploitation alerts with an attack date. Collector to build before the 14 Dec review.

  - id: X20
    name: Internet routing and naming hygiene by country (APNIC Labs, RIPE NCC)
    question: Are the internet's basic protections (DNSSEC validation, RPKI route checking) spreading, country by country and region by region?
    sources: [apnic_labs, ripe_ncc]
    added: 2026-10-26
    feeds_labels: false
    status: planned   # 29 Oct: APNIC Labs only (RIPEstat terms forbid redistribution); waits for APNIC's written leave (requested 29 Oct via helpdesk)
    method: >
      Quarterly snapshot of the public per-country measurements: share of users behind
      resolvers that validate DNSSEC, and share of routes covered by RPKI and of networks
      that drop invalid routes. Reported by region with a world figure weighted by users. A
      measure of the internet's own health, independent of any government's list.

  - id: X21
    name: Regional splits of attack, bot and ransomware series
    question: Do the attack and harm trends differ by world region?
    sources: [radar, ransomware]
    added: 2026-10-26
    feeds_labels: false
    status: active   # 29 Oct: Radar by continent and ransomware.live by country both hold up
    method: >
      Cloudflare Radar layer-7 attack and bot-traffic series by region, and ransomware.live
      monthly posting counts by victim country grouped into regions (aggregates only, as
      the standing rules require; ransomware.live figures published only once permission is
      granted, config/sources.yaml). Shadowserver per-country series are added if approved.

  - id: X22
    name: Breach notifications outside the US
    question: Is reported breach harm rising outside the US too?
    sources: [uk_ico, oaic, enisa, sg_pdpc]
    added: 2026-10-26
    feeds_labels: false
    status: active   # 29 Oct: UK ICO and OAIC; PDPC and ENISA at the March review
    method: >
      Published counts of reported data breaches from the UK ICO, Australia's OAIC (twice a
      year), Singapore's PDPC and ENISA's EU reports, shown next to HHS OCR (X17) and SEC
      Item 1.05. Each regulator's rules on what must be reported differ, so each series is
      read as its own trend, never added together. Lower priority: after X19-X21.

  - id: X23
    name: Age of attacked flaws seen by the SANS ISC honeypots (companion to I4)
    question: What share of the CVE-labelled honeypot activity SANS ISC sees targets flaws more than 12 months old?
    sources: [isc_honeypot, cve]
    added: 2026-10-29
    feeds_labels: false
    status: planned   # author's decision 29 Oct (indicator review); first value with the Q4 2026 pilot
    method: >
      From the monthly X14 aggregates: requests per CVE named in the quarter, each CVE aged
      from its CVE.org publication date; share older than 12 months, computed as I4 is. Reported
      beside I4 (Shadowserver honeypots, or its registered KEV version) and never merged with
      it or used in its place. Honeypots see automated scanning only; CVE names come from URLs.

  - id: X24
    name: Agreement between free exploitation signals (companion to I6)
    question: How far do CISA KEV, the EU Vulnerability Database's exploited flag and the national alerts of X19 agree on which flaws are attacked, and how late is each?
    sources: [kev, euvd, certfr, jpcert]
    added: 2026-10-29
    feeds_labels: false
    status: planned   # author's decision 29 Oct (indicator review); first value with the Q4 2026 pilot
    method: >
      Same method as I6 (pairwise and multi-rater agreement, and each source's median lag
      behind the earliest signal), on CVEs with any signal in the trailing two quarters, using
      only free sources. Reported beside I6 and never in its place: I6 as registered needs
      VulnCheck and Shadowserver. What EUVD's "exploited since" date means is checked first
      (KEV-lag back-test, 9 Nov).

  - id: X25
    name: Supply of AI attack and defence tools on GitHub
    question: How many open-source tools that let an AI attack systems, and how many that let an AI defend them, are published on GitHub; how fast does each side grow, which AI does each build on, and how many attack tools have safeguards?
    sources: [github_search]
    added: 2026-10-30
    feeds_labels: false
    status: active   # author's decision 30 Oct 2026 (12 Nov review item 12, decided early, as a hand-run sweep)
    method: >
      Defence tools added the same day (author, 30 Oct 2026): fixed defence queries beside the
      attack ones, and every repository labelled by what it does (attack, defence, both, model
      testing, unclear), first from its own words, then checked by Claude for every tool with
      100+ stars and confirmed by the author; the two sides are compared by trend, since the
      query lists differ. Run by hand only, never on a timer (Research task github_tools): a baseline in late
      October 2026, then at the start of 2027, mid-2027 and the end of 2027. Fixed queries
      (config/github_tool_queries.yaml) over GitHub's public search; per repository: maker
      (person or organisation), creation date, stars, forks, licence, the AI models or agent
      frameworks named, and for the most-starred whether the README mentions a scope or
      authorisation safeguard. No code is downloaded or run. Claude sorts each sweep (dropping
      tools that test AI models themselves, copies and unrelated hits) and the author confirms
      the register, exploratory/ai_attack_tools.csv. Read as supply, never as use: never
      scored, never counted as an attack, reported beside X3 and X12. Each sweep gives the
      creation-month curve from the start; repeated sweeps add growth in stars and forks.
      The January 2027 sweep is part of the pilot (author, 30 Oct 2026). Every sweep is kept as
      exploratory/ai_tool_sweeps/<date>.csv and catalogued with three charts in
      exploratory/ai_tool_landscape.md (snapshot.x25report), which is part of The Snapshot.
