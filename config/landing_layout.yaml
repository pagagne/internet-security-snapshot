# Landing page layout: one source for the public page and its private go-live mirror
# (author's decisions, 1 Nov 2026: tweak the private mirror, flip it to the real landing page
# with the pilot report on 1 Jan 2027, through a guarded flip with privacy checks).
#
# sections, in page order:
#   readme: the README part with this H2 heading ("top" = everything before the first H2)
#   draft:  a section generated by snapshot.golive (news, intro, timeline, results, x25, hf, attack_log,
#           feed_screen); never public until flipped
#   status: live (on the public page now) or draft (mirror only; goes live at the flip)
#   bare:   a draft section without a heading (the news line), placed as is
#   wording_approved: date the author approved the section's wording and layout (6 Nov 2026 on:
#           sections are approved in two steps, wording first, figures at the 18 Dec clearance)
#   cleared: true when the author has cleared the section's figures for publication; the flip
#           refuses any draft section that is not cleared
# Structure only: no figures live in this file.

flip_date: 2027-01-02   # the day after the pilot report (schedule item landing-flip)
sections:
  # order revised 5 Nov 2026 (author's go-live review): banner, timeline, the latest/next line,
  # the introduction, the mission, the data coverage rings, then a short results line linking
  # to the results page; About the author moves down above AI involvement.
  - {readme: top,                      status: live}
  - {draft: timeline,                  status: draft, cleared: false, wording_approved: 2026-11-06}
  - {draft: news,                      status: draft, cleared: false, bare: true}
  - {draft: intro,                     status: draft, cleared: false, wording_approved: 2026-11-06}
  - {readme: Mission,                  status: live}
  - {readme: "Data coverage: what the study collects so far", status: live}
  - {draft: results,                   status: draft, cleared: false}   # one line linking to results.md (scorecard there only, 6 Nov)
  - {draft: x25,                       status: draft, cleared: false}
  - {draft: hf,                        status: draft, cleared: false}   # added 1 Nov 2026 (author)
  - {draft: attack_log,                status: draft, cleared: false}
  - {draft: feed_screen,               status: draft, cleared: false}
  - {readme: Key documents,            status: live}
  - {readme: Data sources,             status: live}
  - {readme: Schedule,                 status: live}
  - {readme: Workflow schedule,        status: live}
  - {readme: Principles,               status: live}
  - {readme: About the author,         status: live}
  - {readme: AI involvement and conflict of interest, status: live}
  - {readme: Licence,                  status: live}
