# Landing page layout: one source for the public page and its private go-live mirror
# (author's decisions, 1 Nov 2026: tweak the private mirror, flip it to the real landing page
# with the pilot report on 1 Jan 2027, through a guarded flip with privacy checks).
#
# sections, in page order:
#   readme: the README part with this H2 heading ("top" = everything before the first H2)
#   draft:  a section generated by snapshot.golive (news, intro, timeline, results, x25, hf, attack_log,
#           feed_screen); never public until flipped
#   status: live (on the public page now) or draft (mirror only; goes live at the flip)
#   page:   landing (default), results or appendix (three pages, author 6 Nov 2026), or none
#           (kept in the README until the flip, replaced by a draft on the go-live pages)
#   bare:   a draft section without a heading (the news line), placed as is
#   wording_approved: date the author approved the section's wording and layout (6 Nov 2026 on:
#           sections are approved in two steps, wording first, figures at the 18 Dec clearance)
#   cleared: true when the author has cleared the section's figures for publication; the flip
#           refuses any draft section that is not cleared
# Structure only: no figures live in this file.

flip_date: 2027-01-02   # the day after the pilot report (schedule item landing-flip)
sections:
  # Three pages (author's go-live review, 6 Nov 2026). Landing: banner, timeline, news, intro,
  # mission, data coverage, the results line, working rules, about the author, AI involvement,
  # licence. Results: schedule at the top, the results, then X25, Hugging Face, attack log and
  # feed screen. Appendix: key documents, data sources, workflow schedule.
  - {readme: top,                      status: live}
  - {draft: timeline,                  status: draft, cleared: false, wording_approved: 2026-11-06}
  - {draft: news,                      status: draft, cleared: false, bare: true, wording_approved: 2026-11-06}
  - {draft: intro,                     status: draft, cleared: false, wording_approved: 2026-11-06}
  - {readme: Mission,                  status: live}
  - {readme: "Data coverage: what the study collects so far", status: live}
  - {draft: results,                   status: draft, cleared: false, wording_approved: 2026-11-06}   # one line linking to results.md (scorecard there only, 6 Nov)
  - {readme: Principles,               status: live, page: none}        # replaced by the draft below (proposed 6 Nov)
  - {draft: principles,                status: draft, cleared: true, wording_approved: 2026-11-06}   # no figures
  - {readme: About the author,         status: live}
  - {readme: AI involvement and conflict of interest, status: live}
  - {readme: Licence,                  status: live}
  - {readme: Schedule,                 status: live, page: results}
  - {draft: results_page,              status: draft, cleared: false, page: results, wording_approved: 2026-11-06}
  - {draft: x25,                       status: draft, cleared: false, page: results, wording_approved: 2026-11-06}
  - {draft: hf,                        status: draft, cleared: false, page: results, wording_approved: 2026-11-06}   # added 1 Nov 2026 (author)
  - {draft: attack_log,                status: draft, cleared: false, page: results, wording_approved: 2026-11-06}
  - {draft: feed_screen,               status: draft, cleared: false, page: results, wording_approved: 2026-11-06}
  - {readme: Key documents,            status: live, page: appendix}
  - {readme: Data sources,             status: live, page: appendix}
  - {readme: Workflow schedule,        status: live, page: appendix}
