# Cohort selection rules (frozen with the pre-registration).
# Categories are matched in order against the CVE's affected vendor/product
# (CVE record "affected" entries, falling back to NVD CPE). First match wins.
# Which CVE in a category is picked each month is set by the seeded random draw
# in the `selection` block below (v1.1), not by publication order.
version: 1.1   # 1.1 (2026-10-21): seeded random draw replaces earliest-published; see prereg/DEVIATIONS.md

eligibility:
  min_cvss_base: 8.0          # or vendor severity "critical"
  vendor_critical_qualifies: true
  publish_day_max: 25         # published on day 1..25 of the month
  internet_facing_required: true

categories:
  a_edge:
    label: Firewalls, VPNs and remote-access gateways
    product_keywords:
      - firewall
      - vpn
      - gateway
      - remote access
      - ssl vpn
      - secure access
      - globalprotect
      - fortigate
      - fortios
      - netscaler
      - citrix adc
      - ivanti connect secure
      - pulse connect secure
      - sonicwall
      - pan-os
      - asa
      - firepower
      - check point
  b_web_collab:
    label: Web applications, file-transfer and collaboration servers
    product_keywords:
      - file transfer
      - mft
      - moveit
      - goanywhere
      - crushftp
      - sharepoint
      - confluence
      - jira
      - exchange
      - zimbra
      - papercut
      - wordpress
      - drupal
      - gitlab
      - jenkins
      - web server
      - cms
  c_other:
    label: Any other internet-facing product
    product_keywords: []      # catch-all for eligible CVEs not matched above
  d_ai_credited:
    label: AI-credited (credits name an AI tool)
    match_file: config/ai_credit_terms.yaml
    checked_last: true        # only CVEs not already selected in a-c
    hand_check_required: true

root_cause_tag:
  map_file: config/root_cause_map.yaml
  used_for_selection: false

per_month:
  per_category: 1
  max_total: 4
  top_up_by_hand: false
  outcome_data_used_for_selection: false   # never EPSS, KEV or exploitation evidence

# How the one pick per slot is chosen (v1.1). Replaces "earliest published", which
# favoured vendors that publish early in the month.
selection:
  method: seeded_random_draw
  # Each eligible CVE gets a draw key: SHA-256 of "<seed_prefix>|<YYYY-MM>|<slot>|<CVE ID>".
  # Sorting by that key gives a random order that anyone can recompute; it does not
  # depend on publication time, file order, or anything the study measures.
  seed_prefix: internet-security-snapshot
  slot_order: [a_edge, b_web_collab, c_other, d_ai_credited]   # a CVE picked earlier is skipped later
  # Walk the draw order and take the first CVE that passes the slot's hand check
  # (slot c: confirmed internet-facing; slot d: AI credit confirmed). A CVE that
  # fails is recorded with the reason and the next in draw order is used.
