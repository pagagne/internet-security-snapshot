  - kaseya

# Flaws in AI software that the vendor disputes or never patches (added 2026-11-19, author: their
# own line in X5, because there is no fix date to measure a race from). Each entry is dated and
# cites a public source; see docs/cases/ray-shadowray.md.
disputed:
  - cve: CVE-2023-48022
    product: Anyscale Ray (job submission API)
    note: Disputed by the vendor as by design; never patched; exploited (ShadowRay 2024, ShadowRay 2.0 Nov 2025). Added 2026-11-19.
