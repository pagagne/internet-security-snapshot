  # AI browsers (added 2026-11-12, author: browsers with built-in AI agents). Exact names only:
  # "comet", "atlas", "neo" or "dia" alone would match unrelated products (MongoDB Atlas, Neo4j).
  # Checked against NVD on 12 Nov: Opera Neon has a CVE; Perplexity Comet and Norton Neo have none
  # yet (Comet's reported flaws were disclosed without CVEs). Edge's Copilot Mode is not matchable
  # apart from Edge itself, so it is left out.
  - perplexity comet
  - chatgpt atlas
  - norton neo
  - opera neon
  - browser company dia
  - dia browser
  - genspark
  # AI orchestration, serving and data planes (added 2026-11-19, author's decisions folding the
  # retired X29 into X5). Names chosen to avoid collisions: "chroma" alone matches colour tools,
  # so "chromadb"; "triton" alone matches unrelated products, so the full server name above.
  - kuberay
  - anyscale
  - bentoml
  - clearml
  - open-webui
  - qdrant
  - milvus
  - weaviate
  - chromadb
  - pgvector
  - langsmith
  - ragflow

