# Products counted as "AI software" for exploratory measure X5. Matched whole-word,
# case-insensitive, against CVE affected vendor|product strings. Additions are dated.
version: 1.2   # 2026-10-22; 1.1 on 2026-11-12 (AI browsers, author); 1.2 on 2026-11-19 (AI infrastructure, author)
