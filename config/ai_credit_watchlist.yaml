# Watchlist for new AI tools and labs ("newcomers"), refreshed every quarter.
#
# Candidates here are NOT matched until promoted into ai_credit_terms.yaml with a version
# bump and a dated entry in prereg/DEVIATIONS.md. Every quarter T7 is reported under the
# registered list (v1.0) and the current list, so additions never rewrite history.
version: 1.1   # 1.1 (2026-10-22): ordinary-word naming rule; Flint/Recursive added

refresh_each_quarter:
  # 1. Automatic: the pull lists credit texts that look AI-related but match no term
  #    (see snapshot.classify.unmatched_ai_signals). Reviewed with the hand check.
  # 2. Manual sweep of these sources, with extra attention to China and the rest of Asia:
  sources:
    - LMArena and Artificial Analysis leaderboards (new frontier-class models)
    - SuperCLUE and OpenCompass leaderboards (Chinese models)
    - China's generative-AI service filing lists (Cyberspace Administration of China)
    - Security conferences with AI vulnerability work (ISC.AI, Tianfu Cup, GeekPwn, DEF CON, Black Hat)
    - Threat and vulnerability reports from AI labs and security vendors
    - AI-attributed CVE trackers

promotion_rule:
  # A candidate is promoted when it appears in at least one CVE credit, or is a model or
  # security tool from a lab already on the list, or a new lab ranks among the top
  # models on a leaderboard above. Lab and company names go to `lab_names` (need an
  # explicit AI-tool mention to count); model and tool names go to `tool_names`.
  record: name, lab, country, first seen (date and source), promoted in version

ordinary_word_rule:
  # Names that are also ordinary words, surnames, places or other products (e.g. "Flint",
  # "Recursive") are never added as bare terms. They are watched and, if promoted,
  # matched only through qualified phrases that name the model with its lab or the word
  # "model"/"AI" (listed under `phrases` for each candidate). This keeps false matches
  # out of the hand-check queue.

