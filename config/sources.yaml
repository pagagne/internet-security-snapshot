# One switch per source that needs permission (docs/PERMISSIONS.md), so moving between
# Plan 1 (permission granted) and Plan 2 (no permission) in docs/RESEARCH_PLAN.md is a
# settings change, not a code change. Read by snapshot.sources; the quarterly pull
# (snapshot.pull) skips any source whose `collect` is false and records every switch in the
# run's manifest. Tests check this file against docs/PERMISSIONS.md.
#
#   permission: awaiting | granted | declined   (as docs/PERMISSIONS.md records it)
#   collect:    the quarterly pull fetches it
#   publish:    figures derived from it may appear in public outputs; only with a written yes
#   pull:       the pull's name for its collector, or null if no collector exists yet
#
# Change a switch only together with the PERMISSIONS.md row (and, after the 29 Dec 2026
# freeze, a prereg/DEVIATIONS.md entry, decision item 16 in docs/CORE_FREEZE_DECISIONS.md).

permissioned:
  ransomware_live:
    name: ransomware.live
    permission: granted   # written yes, ticket #3425, 27 Oct 2026 (seven conditions in docs/PERMISSIONS.md)
    collect: true     # aggregate counts only, api-pro endpoint with the author's token (condition 1)
    publish: true     # aggregates only, credited to ransomware.live; never raw data (conditions 3, 6)
    pull: ransomware
  vulncheck:
    name: VulnCheck KEV (community)
    permission: granted   # 11 Nov 2026: attribution of the source data is the only requirement (docs/PERMISSIONS.md)
    collect: true         # author, 11 Nov 2026: on from the 1 Dec dry run
    publish: true         # derived statistics only, labelled "VulnCheck KEV"
    raw_public: false     # entries never republished: the per-CVE table stays in the private part
    pull: vulncheck       # feeds T_exploit (snapshot.events other_exploit) and I6
  shadowserver:
    name: Shadowserver
    permission: awaiting
    collect: false
    publish: false
    pull: null        # no collector yet; public dashboard series, aggregates only
