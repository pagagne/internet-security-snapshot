# Feeds read by the monthly AI-attack feed screen (author's decision, 29 Oct 2026).
# Each feed is read once a month; items from the last 35 days that mention both an AI term
# and an attack term become candidates for the X3 log (exploratory, never scored). The
# author confirms or excludes each in the quarterly hand-check window. Dead or moved feeds are
# reported in each run and fixed here with a dated note; additions are dated too.
# Groups: vendor research, government and CERTs, AI labs and AI-incident databases, news (leads
# only), and non-English sources (the X3 sweep's nine languages).
ai_terms: ["AI agent", "AI agents", "agentic", "LLM", "large language model", "generative AI", "GenAI",
           "AI-generated", "AI-powered", "AI-assisted", "AI-driven", "autonomous agent", "ChatGPT", "OpenAI",
           "Claude", "Anthropic", "Gemini", "DeepSeek", "Qwen", "Copilot", "Codex", "MCP server",
           "prompt injection", "LLMjacking", "vibe hacking", "OpenClaw", "Hermes Agent", "CyberStrikeAI", "ARTEX",
           "人工智能", "大模型", "智能体", "生成AI", "生成 AI", "AIエージェント", "ИИ", "нейросет", "KI-Agent", "IA générative"]
attack_terms: ["attack", "attacker", "campaign", "intrusion", "breach", "breached", "compromise", "compromised",
               "malware", "ransomware", "threat actor", "hacker", "hackers", "exploit", "exploited", "phishing",
               "espionage", "stolen", "攻击", "入侵", "攻撃", "атак", "взлом", "Angriff", "attaque"]
added: 2026-10-29
